apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: ngkgstoragerecoveries.ngkg.io
spec:
  group: ngkg.io
  names:
    kind: NgkgStorageRecovery
    listKind: NgkgStorageRecoveryList
    plural: ngkgstoragerecoveries
    singular: ngkgstoragerecovery
    shortNames: [ngkgsr]
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources: {status: {}}
      additionalPrinterColumns:
        - {name: Kind, type: string, jsonPath: .spec.kind}
        - {name: Snapshot, type: string, jsonPath: .spec.sourceSnapshotId}
        - {name: Condition, type: string, jsonPath: .status.condition}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              additionalProperties: false
              required: [tenantId, datasetId, operationId, sourceSnapshotId, kind, planObjectKey, planSha256, taskCount, maxParallelism, largestTaskBytes, maxInFlightBytes, resourceProfile]
              properties:
                tenantId: {type: string, format: uuid}
                datasetId: {type: string, format: uuid}
                operationId: {type: string, format: uuid}
                sourceSnapshotId: {type: string, format: uuid}
                restoredSnapshotId: {type: string, format: uuid}
                kind: {type: string, enum: [replicate, relocate, node-loss, backup, restore]}
                planObjectKey: {type: string, minLength: 1, maxLength: 1024}
                planSha256: {type: string, pattern: '^[0-9a-f]{64}$'}
                taskCount: {type: integer, format: int32, minimum: 0, maximum: 10000000}
                maxParallelism: {type: integer, format: int32, minimum: 1, maximum: 4096}
                largestTaskBytes: {type: integer, format: int64, minimum: 0}
                maxInFlightBytes: {type: integer, format: int64, minimum: 1}
                resourceProfile: {type: string, minLength: 1, maxLength: 128}
            status:
              type: object
              additionalProperties: false
              properties:
                observedGeneration: {type: integer, format: int64}
                transferJobName: {type: string}
                finalizeJobName: {type: string}
                recoveryCertificateObjectKey: {type: string}
                recoveryCertificateSha256: {type: string, pattern: '^[0-9a-f]{64}$'}
                backupManifestObjectKey: {type: string}
                backupManifestSha256: {type: string, pattern: '^[0-9a-f]{64}$'}
                restoreCertificateObjectKey: {type: string}
                restoreCertificateSha256: {type: string, pattern: '^[0-9a-f]{64}$'}
                quarantinedReplicaCount: {type: integer, format: int32, minimum: 0}
                condition: {type: string, maxLength: 256}
