apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: ngkgsourceimports.ngkg.io
spec:
  group: ngkg.io
  scope: Namespaced
  names:
    plural: ngkgsourceimports
    singular: ngkgsourceimport
    kind: NgkgSourceImport
    shortNames: [ngkgsi]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: State
          type: string
          jsonPath: .status.condition
        - name: Objects
          type: integer
          jsonPath: .status.selectedObjectCount
        - name: Bytes
          type: integer
          jsonPath: .status.selectedSourceBytes
        - name: Decode Work
          type: integer
          jsonPath: .status.decodeWorkItemCount
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              additionalProperties: false
              x-kubernetes-validations:
                - rule: self == oldSelf
                  message: NgkgSourceImport spec is immutable
                - rule: 'size(self.objectKeys) > 0 ? !has(self.prefix) : has(self.prefix)'
                  message: provide objectKeys or prefix, but not both
                - rule: "self.provider == 'azure-blob' ? has(self.accountName) : !has(self.accountName)"
                  message: accountName is required only for azure-blob
              required: [tenantId, datasetId, operationId, provider, bucket, objectKeys, includePatterns, excludeSegments, identityRef, versionPolicy, targetSnapshotId, publicationPolicy, resourceProfile, maxSourceBytes, maxSourceObjects, logicalPartitions, ontologyQualificationRequestObjectKey, ontologyQualificationRequestSha256]
              properties:
                tenantId: {type: string, format: uuid}
                datasetId: {type: string, format: uuid}
                operationId: {type: string, format: uuid}
                provider: {type: string, enum: [aws-s3, azure-blob, gcs]}
                bucket: {type: string, minLength: 3, maxLength: 255}
                accountName: {type: string, minLength: 1, maxLength: 63, nullable: true}
                prefix:
                  type: string
                  nullable: true
                  minLength: 1
                  maxLength: 1024
                  pattern: '^[A-Za-z0-9_][A-Za-z0-9._/-]*$'
                objectKeys:
                  type: array
                  maxItems: 1000000
                  items:
                    type: string
                    minLength: 1
                    maxLength: 1024
                    pattern: '^[A-Za-z0-9_][A-Za-z0-9._/-]*\.[Tt][Rr][Ii][Gg]$'
                includePatterns:
                  type: array
                  minItems: 1
                  maxItems: 1
                  items: {type: string, enum: ['**/*.trig']}
                excludeSegments:
                  type: array
                  minItems: 3
                  uniqueItems: true
                  items: {type: string, minLength: 1, maxLength: 63}
                identityRef:
                  type: string
                  minLength: 1
                  maxLength: 63
                  pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                versionPolicy:
                  type: string
                  enum: [require-versioned-objects, require-immutable-checksum]
                targetSnapshotId: {type: string, format: uuid}
                parentSnapshotId: {type: string, format: uuid, nullable: true}
                publicationPolicy:
                  type: string
                  enum: [manual-after-certification, automatic-after-certification]
                resourceProfile: {type: string, minLength: 1, maxLength: 128}
                maxSourceBytes:
                  type: integer
                  format: int64
                  minimum: 1
                  maximum: 1125899906842624
                maxSourceObjects:
                  type: integer
                  format: int32
                  minimum: 1
                  maximum: 1000000
                logicalPartitions:
                  type: integer
                  format: int32
                  minimum: 1
                  maximum: 65536
                ontologyQualificationRequestObjectKey:
                  type: string
                  minLength: 1
                  maxLength: 1024
                  pattern: '^[A-Za-z0-9_][A-Za-z0-9._/-]*$'
                ontologyQualificationRequestSha256:
                  type: string
                  pattern: '^[0-9a-f]{64}$'
            status:
              type: object
              additionalProperties: false
              properties:
                observedGeneration: {type: integer, format: int64, nullable: true}
                jobName: {type: string, nullable: true}
                sourceManifestObjectKey: {type: string, nullable: true}
                sourceManifestSha256:
                  type: string
                  nullable: true
                  pattern: '^[0-9a-f]{64}$'
                decodePlanObjectKey: {type: string, nullable: true}
                decodePlanSha256:
                  type: string
                  nullable: true
                  pattern: '^[0-9a-f]{64}$'
                decodeWorkItemCount: {type: integer, format: int32, minimum: 1, nullable: true}
                decodeJobName: {type: string, nullable: true}
                finalizeJobName: {type: string, nullable: true}
                compilerHandoffObjectKey: {type: string, nullable: true}
                compilerHandoffSha256:
                  type: string
                  nullable: true
                  pattern: '^[0-9a-f]{64}$'
                semanticMapJobName: {type: string, nullable: true}
                semanticDictionaryJobName: {type: string, nullable: true}
                semanticDictionaryObjectKey: {type: string, nullable: true}
                semanticDictionarySha256:
                  type: string
                  nullable: true
                  pattern: '^[0-9a-f]{64}$'
                semanticPartitionJobName: {type: string, nullable: true}
                semanticFinalizeJobName: {type: string, nullable: true}
                semanticCompilationRootObjectKey: {type: string, nullable: true}
                semanticCompilationRootSha256:
                  type: string
                  nullable: true
                  pattern: '^[0-9a-f]{64}$'
                compiledFactCount: {type: integer, format: int64, minimum: 0, nullable: true}
                ontologyProjectionJobName: {type: string, nullable: true}
                ontologyAssemblyJobName: {type: string, nullable: true}
                ontologyAssemblyObjectKey: {type: string, nullable: true}
                ontologyAssemblySha256:
                  type: string
                  nullable: true
                  pattern: '^[0-9a-f]{64}$'
                ontologyQualificationJobName: {type: string, nullable: true}
                ontologyQualificationRootObjectKey: {type: string, nullable: true}
                ontologyQualificationRootSha256:
                  type: string
                  nullable: true
                  pattern: '^[0-9a-f]{64}$'
                offlineReasoningPlanJobName: {type: string, nullable: true}
                offlineReasoningPlanObjectKey: {type: string, nullable: true}
                offlineReasoningPlanSha256:
                  type: string
                  nullable: true
                  pattern: '^[0-9a-f]{64}$'
                offlineReasoningPartitionCount: {type: integer, format: int32, minimum: 1, nullable: true}
                offlineReasoningPartitionJobName: {type: string, nullable: true}
                offlineReasoningFinalizeJobName: {type: string, nullable: true}
                offlineReasoningRootObjectKey: {type: string, nullable: true}
                offlineReasoningRootSha256:
                  type: string
                  nullable: true
                  pattern: '^[0-9a-f]{64}$'
                snapshotActivationJobName: {type: string, nullable: true}
                snapshotActivationManifestObjectKey: {type: string, nullable: true}
                snapshotActivationManifestSha256:
                  type: string
                  nullable: true
                  pattern: '^[0-9a-f]{64}$'
                snapshotPublicationState: {type: string, nullable: true}
                selectedObjectCount: {type: integer, format: int32, minimum: 0, nullable: true}
                selectedSourceBytes: {type: integer, format: int64, minimum: 0, nullable: true}
                parsedQuadCount: {type: integer, format: int64, minimum: 0, nullable: true}
                condition: {type: string, nullable: true}
