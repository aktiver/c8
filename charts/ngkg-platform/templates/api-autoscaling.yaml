{{- if .Values.api.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ngkg-api
  labels: {app.kubernetes.io/name: ngkg, app.kubernetes.io/component: api}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ngkg-api
  minReplicas: {{ .Values.api.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.api.autoscaling.maxReplicas }}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: {{ .Values.api.autoscaling.scaleUpStabilizationSeconds }}
      policies:
        - type: Percent
          value: {{ .Values.api.autoscaling.scaleUpPercent }}
          periodSeconds: {{ .Values.api.autoscaling.scaleUpPeriodSeconds }}
    scaleDown:
      stabilizationWindowSeconds: {{ .Values.api.autoscaling.scaleDownStabilizationSeconds }}
      policies:
        - type: Percent
          value: {{ .Values.api.autoscaling.scaleDownPercent }}
          periodSeconds: {{ .Values.api.autoscaling.scaleDownPeriodSeconds }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.api.autoscaling.cpuUtilizationTargetPercent }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.api.autoscaling.memoryUtilizationTargetPercent }}
{{- end }}
