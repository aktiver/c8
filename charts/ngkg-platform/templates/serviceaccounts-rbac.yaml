apiVersion: v1
kind: ServiceAccount
metadata:
  name: ngkg-api
  labels: {app.kubernetes.io/name: ngkg, app.kubernetes.io/component: api}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ngkg-operator
  labels: {app.kubernetes.io/name: ngkg, app.kubernetes.io/component: operator}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ngkg-distributed-operator
  labels: {app.kubernetes.io/name: ngkg, app.kubernetes.io/component: distributed-operator}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ngkg-storage-recovery-operator
  labels: {app.kubernetes.io/name: ngkg, app.kubernetes.io/component: storage-recovery-operator}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.storageRecovery.serviceAccount }}
  labels: {app.kubernetes.io/name: ngkg, app.kubernetes.io/component: storage-recovery-worker}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.operator.reference.serviceAccount }}
  labels: {app.kubernetes.io/name: ngkg, app.kubernetes.io/component: reference-worker}
  annotations: {{- toYaml .Values.serviceAccounts.referenceWorker.annotations | nindent 4 }}
automountServiceAccountToken: {{ .Values.serviceAccounts.referenceWorker.automountToken }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.distributedOperator.serviceAccount }}
  labels: {app.kubernetes.io/name: ngkg, app.kubernetes.io/component: distributed-worker}
  annotations: {{- toYaml .Values.serviceAccounts.distributedWorker.annotations | nindent 4 }}
automountServiceAccountToken: {{ .Values.serviceAccounts.distributedWorker.automountToken }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ngkg-api
rules:
  - apiGroups: [ngkg.io]
    resources: [ngkgcompilations, ngkgsourceimports, ngkgstoragerecoveries]
    verbs: [get, list, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ngkg-api
subjects:
  - kind: ServiceAccount
    name: ngkg-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ngkg-api
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ngkg-storage-recovery-operator
rules:
  - apiGroups: [ngkg.io]
    resources: [ngkgstoragerecoveries, ngkgstoragerecoveries/status]
    verbs: [get, list, watch, patch, update]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ngkg-storage-recovery-operator
subjects:
  - kind: ServiceAccount
    name: ngkg-storage-recovery-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ngkg-storage-recovery-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ngkg-operator
rules:
  - apiGroups: [ngkg.io]
    resources: [ngkgcompilations, ngkgcompilations/status, ngkgsourceimports, ngkgsourceimports/status]
    verbs: [get, list, watch, patch, update]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, patch, delete]
  - apiGroups: ['']
    resources: [pods, persistentvolumeclaims]
    verbs: [get, list, watch, create, patch, delete]
  - apiGroups: ['']
    resources: [serviceaccounts]
    verbs: [get]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings]
    verbs: [get, list, watch, create, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ngkg-operator
subjects:
  - kind: ServiceAccount
    name: ngkg-operator
  - kind: ServiceAccount
    name: ngkg-distributed-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ngkg-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: '{{ .Release.Namespace }}-{{ .Release.Name }}-ngkg-source-volume-operator'
rules:
  - apiGroups: ['']
    resources: [persistentvolumes]
    verbs: [get, list, watch, create, patch, delete]
  - apiGroups: [storage.k8s.io]
    resources: [csidrivers]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: '{{ .Release.Namespace }}-{{ .Release.Name }}-ngkg-source-volume-operator'
subjects:
  - kind: ServiceAccount
    name: ngkg-operator
    namespace: '{{ .Release.Namespace }}'
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: '{{ .Release.Namespace }}-{{ .Release.Name }}-ngkg-source-volume-operator'
