apiVersion: apps/v1
kind: Deployment
metadata:
  name: ngkg-api
  labels: {app.kubernetes.io/name: ngkg, app.kubernetes.io/component: api}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels: {app.kubernetes.io/name: ngkg, app.kubernetes.io/component: api}
  template:
    metadata:
      labels: {app.kubernetes.io/name: ngkg, app.kubernetes.io/component: api}
    spec:
      serviceAccountName: ngkg-api
      imagePullSecrets: {{ toJson .Values.imagePullSecrets }}
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/name: ngkg, app.kubernetes.io/component: api}
      containers:
        - name: api
          image: '{{ required "images.api.repository is required" .Values.images.api.repository }}@{{ required "images.api.digest is required" .Values.images.api.digest }}'
          imagePullPolicy: {{ .Values.images.api.pullPolicy }}
          ports: [{name: http, containerPort: {{ .Values.service.apiPort }}}]
          env:
            - {name: NGKG_BIND_ADDR, value: '0.0.0.0:{{ .Values.service.apiPort }}'}
            - {name: NGKG_WORKLOAD_NAMESPACE, valueFrom: {fieldRef: {fieldPath: metadata.namespace}}}
            - {name: NGKG_AUTH_TOKENS_FILE, value: /var/run/ngkg/auth/tokens.json}
            - {name: NGKG_AUTH_TOKENS_FILE_SHA256, value: '{{ required "api.authTokensFileSha256 is required" .Values.api.authTokensFileSha256 }}'}
            - {name: NGKG_ALLOWED_RESOURCE_PROFILES, value: '{{ join "," .Values.api.allowedResourceProfiles }}'}
            - {name: NGKG_ARTIFACT_BASE_URL, value: '{{ required "artifactStore.baseUrl is required" .Values.artifactStore.baseUrl }}'}
            - {name: NGKG_SOURCE_UPLOAD_SCRATCH_ROOT, value: /scratch/uploads}
            - {name: NGKG_SOURCE_UPLOAD_OBJECT_PREFIX, value: '{{ required "api.sourceUpload.objectPrefix is required" .Values.api.sourceUpload.objectPrefix }}'}
            - {name: NGKG_MAX_TRIG_UPLOAD_BYTES, value: '{{ .Values.api.sourceUpload.maxBytes }}'}
            - {name: NGKG_MAX_TRIG_UPLOAD_QUADS, value: '{{ .Values.api.sourceUpload.maxQuads }}'}
            - {name: NGKG_MAX_TRIG_NAMED_GRAPHS, value: '{{ .Values.api.sourceUpload.maxNamedGraphs }}'}
            - {name: NGKG_MAX_TRIG_UPLOADS_IN_FLIGHT, value: '{{ .Values.api.sourceUpload.maxInFlight }}'}
            - {name: NGKG_SOURCE_UPLOAD_SINGLE_PUT_MAX_BYTES, value: '{{ .Values.api.sourceUpload.singlePutMaxBytes }}'}
            - {name: NGKG_SOURCE_UPLOAD_MULTIPART_BUFFER_BYTES, value: '{{ .Values.api.sourceUpload.multipartBufferBytes }}'}
            - {name: NGKG_SOURCE_UPLOAD_MULTIPART_CONCURRENCY, value: '{{ .Values.api.sourceUpload.multipartConcurrency }}'}
            - {name: NGKG_STORAGE_RECOVERY_API_SCRATCH_ROOT, value: /scratch/storage-recovery}
            - {name: NGKG_STORAGE_TARGETS_JSON, value: {{ .Values.storageRecovery.targetsJson | quote }}}
            - {name: NGKG_PRIMARY_STORAGE_TARGET, value: '{{ .Values.storageRecovery.primaryTarget }}'}
            - {name: NGKG_STORAGE_RECOVERY_MAX_MANIFEST_BYTES, value: '{{ .Values.storageRecovery.maxManifestBytes }}'}
            - {name: NGKG_STORAGE_RECOVERY_MAX_ARTIFACT_BYTES, value: '{{ .Values.storageRecovery.maxArtifactBytes }}'}
            - {name: NGKG_STORAGE_RECOVERY_MAX_ARTIFACTS, value: '{{ .Values.storageRecovery.maxArtifacts }}'}
            - {name: NGKG_STORAGE_RECOVERY_MAX_TASK_BYTES, value: '{{ .Values.storageRecovery.maxTaskBytes }}'}
            - {name: NGKG_STORAGE_RECOVERY_MAX_PARALLELISM, value: '{{ .Values.storageRecovery.maxParallelism }}'}
            - {name: NGKG_STORAGE_RECOVERY_MAX_IN_FLIGHT_BYTES, value: '{{ .Values.storageRecovery.maxInFlightBytes }}'}
            - {name: NGKG_STORAGE_RECOVERY_RESOURCE_PROFILE, value: '{{ .Values.storageRecovery.resourceProfile }}'}
            - name: NGKG_DATABASE_URL
              valueFrom: {secretKeyRef: {name: '{{ required "dependencies.databaseSecret is required" .Values.dependencies.databaseSecret }}', key: database-url}}
          {{ if .Values.dependencies.objectStoreCredentialsSecret }}
          envFrom:
            - secretRef:
                name: '{{ .Values.dependencies.objectStoreCredentialsSecret }}'
          {{ end }}
          resources: {{- toYaml .Values.resources.api | nindent 12 }}
          volumeMounts:
            - {name: auth, mountPath: /var/run/ngkg/auth, readOnly: true}
            - {name: source-upload-scratch, mountPath: /scratch/uploads}
            - {name: storage-recovery-scratch, mountPath: /scratch/storage-recovery}
          readinessProbe: {httpGet: {path: /health/ready, port: http, scheme: HTTP}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health/live, port: http, scheme: HTTP}, periodSeconds: 10}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: {drop: [ALL]}
      volumes:
        - name: auth
          secret:
            secretName: '{{ required "dependencies.authTokensSecret is required" .Values.dependencies.authTokensSecret }}'
            items: [{key: tokens.json, path: tokens.json}]
        - name: source-upload-scratch
          emptyDir:
            sizeLimit: {{ .Values.api.sourceUpload.scratchSizeLimit }}
        - name: storage-recovery-scratch
          emptyDir:
            sizeLimit: {{ .Values.storageRecovery.apiScratchSize }}
---
apiVersion: v1
kind: Service
metadata:
  name: ngkg-api
spec:
  selector: {app.kubernetes.io/name: ngkg, app.kubernetes.io/component: api}
  ports: [{name: http, port: 80, targetPort: http}]
