apiVersion: apps/v1
kind: StatefulSet
metadata: {name: ngkg-locator}
spec:
  serviceName: ngkg-locator
  replicas: {{ max 3 .Values.queryPlane.locatorReplicaFactor }}
  selector:
    matchLabels: {app.kubernetes.io/name: ngkg, app.kubernetes.io/component: locator}
  template:
    metadata:
      labels: {app.kubernetes.io/name: ngkg, app.kubernetes.io/component: locator, ngkg.io/network-plane: data}
      annotations:
        ngkg.io/auth-tokens-file-sha256: '{{ required "onlineServing.authTokensFileSha256 is required" .Values.onlineServing.authTokensFileSha256 }}'
        ngkg.io/tenant-admission-policy-sha256: '{{ required "onlineServing.tenantAdmissionPolicySha256 is required" .Values.onlineServing.tenantAdmissionPolicySha256 }}'
    spec:
      serviceAccountName: ngkg-query
      terminationGracePeriodSeconds: 120
      nodeSelector: {ngkg.io/workload: sparql-query-processing}
      tolerations:
        - {key: ngkg.io/workload, operator: Equal, value: sparql-query-processing, effect: NoSchedule}
      containers:
        - name: locator
          image: '{{ required "images.locator.repository is required" .Values.images.locator.repository }}@{{ required "images.locator.digest is required" .Values.images.locator.digest }}'
          args: [locator]
          ports: [{name: http, containerPort: 32020}]
