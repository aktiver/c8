            - {name: NGKG_HYDRATION_TIMEOUT_SECONDS, value: '{{ .Values.onlineServing.hydrationTimeoutSeconds }}'}
          envFrom:
            - configMapRef: {name: ngkg-phase40-online-ceilings}
          {{- if .Values.onlineServing.objectStoreCredentialsSecret }}
            - secretRef: {name: '{{ .Values.onlineServing.objectStoreCredentialsSecret }}'}
          {{- end }}
          resources: {{- toYaml .Values.resources.hydration | nindent 12 }}
          startupProbe: {httpGet: {path: /health/ready, port: http}, periodSeconds: 5, failureThreshold: 60}
          readinessProbe: {httpGet: {path: /health/ready, port: http}, periodSeconds: 5, timeoutSeconds: 2, failureThreshold: 3}
          livenessProbe: {httpGet: {path: /health/live, port: http}, periodSeconds: 15, timeoutSeconds: 2, failureThreshold: 3}
          volumeMounts:
            - {name: tls, mountPath: /var/run/ngkg/tls, readOnly: true}
            - {name: auth, mountPath: /var/run/ngkg/auth, readOnly: true}
            - {name: tenant-admission, mountPath: /var/run/ngkg/admission, readOnly: true}
            - {name: payload-cache, mountPath: /var/lib/ngkg/cache}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: {drop: [ALL]}
      volumes:
        - name: tls
          secret: {secretName: '{{ required "tls.existingSecret is required" .Values.tls.existingSecret }}'}
        - name: auth
          secret: {secretName: '{{ required "onlineServing.authTokensSecret is required" .Values.onlineServing.authTokensSecret }}'}
        - name: tenant-admission
          secret: {secretName: '{{ required "onlineServing.tenantAdmissionSecret is required" .Values.onlineServing.tenantAdmissionSecret }}'}
        - name: payload-cache
          emptyDir: {sizeLimit: '{{ .Values.onlineServing.cacheSizeLimit }}'}
