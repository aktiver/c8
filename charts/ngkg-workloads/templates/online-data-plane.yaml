---
apiVersion: apps/v1
kind: Deployment
metadata: {name: ngkg-hydration}
spec:
  replicas: {{ .Values.hpcNodeGroups.parquet_hydration_num_of_nodes }}
  selector:
    matchLabels: {app.kubernetes.io/name: ngkg, app.kubernetes.io/component: hydration}
  template:
    metadata:
      labels: {app.kubernetes.io/name: ngkg, app.kubernetes.io/component: hydration, ngkg.io/network-plane: data}
      annotations:
        ngkg.io/auth-tokens-file-sha256: '{{ required "onlineServing.authTokensFileSha256 is required" .Values.onlineServing.authTokensFileSha256 }}'
        ngkg.io/tenant-admission-policy-sha256: '{{ required "onlineServing.tenantAdmissionPolicySha256 is required" .Values.onlineServing.tenantAdmissionPolicySha256 }}'
    spec:
      serviceAccountName: ngkg-hydration
      nodeSelector: {ngkg.io/workload: parquet-hydration}
      tolerations:
        - {key: ngkg.io/workload, operator: Equal, value: parquet-hydration, effect: NoSchedule}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels: {app.kubernetes.io/name: ngkg, app.kubernetes.io/component: hydration}
      containers:
        - name: hydration
          image: '{{ required "images.hydration.repository is required" .Values.images.hydration.repository }}@{{ required "images.hydration.digest is required" .Values.images.hydration.digest }}'
          args: [hydration]
          ports: [{name: http, containerPort: 32030}]
          env:
            - {name: OMP_NUM_THREADS, value: '1'}
            - {name: OPENBLAS_NUM_THREADS, value: '1'}
            - {name: MKL_NUM_THREADS, value: '1'}
            - {name: OMP_MAX_ACTIVE_LEVELS, value: '1'}
