openapi: 3.1.0
info:
  title: NGKG vLLM Pod Agent
  version: 0.9.0
  description: Cluster-internal GPU-pod readiness, exact-model verification, bounded proxy, metrics and loopback-only drain control.
paths:
  /health/live:
    get: {operationId: vllmPodLive, responses: {'204': {description: Pod agent is live}}}
  /health/ready:
    get:
      operationId: vllmPodReady
      responses:
        '204': {description: Expected vLLM model is loaded and the pod is accepting work}
        '503': {description: Model is loading, unhealthy, or draining}
  /v1/chat/completions:
    post:
      operationId: proxyVllmChatCompletion
      description: Forwards an admitted request to the loopback-only vLLM engine exactly once.
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses:
        '200': {description: OpenAI-compatible completion}
        '429': {description: Per-pod concurrency exhausted}
        '503': {description: Pod is not ready or is draining}
  /metrics:
    get: {operationId: vllmPodMetrics, responses: {'200': {description: Prometheus metrics}}}
  /openapi.yaml:
    get: {operationId: vllmPodOpenApi, responses: {'200': {description: This immutable contract}}}
  /admin/drain:
    post:
      operationId: drainVllmPod
      description: Loopback-only lifecycle operation that removes readiness and waits for admitted calls. It is unreachable through the Kubernetes Service.
      servers: [{url: 'http://127.0.0.1:8082'}]
      responses:
        '204': {description: Drain completed with no in-flight calls}
        '408': {description: Bounded drain deadline expired}
