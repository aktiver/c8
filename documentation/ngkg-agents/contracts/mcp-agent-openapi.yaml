openapi: 3.1.0
info:
  title: NGKG MCP and Agent REST API
  version: 0.8.0
  description: Complete REST parity for NGKG semantic MCP tools, long-input compilation, managed agents, tenant tools, evidence-bound memory and distributed CPU qualification. Load this endpoint directly in Swagger UI.
servers: [{url: /}]
security: [{bearerAuth: []}]
tags:
  - {name: MCP, description: MCP Streamable HTTP transport}
  - {name: Semantic Query, description: REST parity for built-in semantic MCP tools}
  - {name: Agent Inputs, description: Resumable long-input ingestion and deterministic compilation}
  - {name: Managed Agents, description: Reasoning-bound model execution}
  - {name: Tenant Tools, description: Qualified tenant MCP providers and calls}
  - {name: Agent Memory, description: Five-class evidence-bound long-term memory}
  - {name: CPU Qualification, description: Deterministic multinode CPU work with bounded spill and checkpoints}
paths:
  /openapi.yaml:
    get: {security: [], tags: [MCP], operationId: getOpenApiContract, summary: Download the complete gateway OpenAPI 3.1 contract, responses: {'200': {description: OpenAPI YAML, content: {application/yaml: {schema: {type: string}}}}}}
  /swagger-ui:
    get: {security: [], tags: [MCP], operationId: getSwaggerUi, summary: Open interactive Swagger documentation for every REST-driven MCP and agent operation, responses: {'200': {description: Swagger UI HTML}}}
  /mcp:
    post: {tags: [MCP], operationId: mcpStreamableHttp, summary: MCP initialize, tools/list and tools/call transport, requestBody: {required: true, content: {application/json: {schema: {type: object}}}}, responses: {'200': {description: MCP JSON or SSE response}, '401': {$ref: '#/components/responses/Unauthorized'}}}
  /v1/datasets/{datasetId}/active-snapshot:
    get: {tags: [Semantic Query], operationId: getActiveSnapshot, x-mcp-tool: ngkg_get_active_snapshot, summary: Resolve the authorized active snapshot through an ASK barrier, parameters: [{$ref: '#/components/parameters/datasetId'}], responses: {'200': {$ref: '#/components/responses/SemanticEnvelope'}, '502': {$ref: '#/components/responses/DependencyFailure'}}}
  /v1/datasets/{datasetId}/query:
    post: {tags: [Semantic Query], operationId: executeSemanticQuery, x-mcp-tools: [ngkg_query, ngkg_construct_context_graph], summary: Execute authorized snapshot-bound SPARQL and return a reasoned envelope, parameters: [{$ref: '#/components/parameters/datasetId'}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/QueryRequest'}}}}, responses: {'200': {$ref: '#/components/responses/SemanticEnvelope'}, '502': {$ref: '#/components/responses/DependencyFailure'}}}
  /v1/query_logs/{queryExecutionId}:
    get: {tags: [Semantic Query], operationId: getQueryLog, x-mcp-tool: ngkg_get_query_log, summary: Get immutable query timing, user and configured allocation evidence, parameters: [{$ref: '#/components/parameters/queryExecutionId'}], responses: {'200': {description: Query log and explicit resource semantics}, '502': {$ref: '#/components/responses/DependencyFailure'}}}
  /v1/agent-inputs:
    post: {tags: [Agent Inputs], operationId: createAgentInput, summary: Create a resumable checksum-bound input session, responses: {'201': {description: Input session}}}
  /v1/agent-inputs/{inputId}/parts/{ordinal}:
    put: {tags: [Agent Inputs], operationId: uploadAgentInputPart, summary: Upload an idempotent input part, parameters: [{$ref: '#/components/parameters/inputId'}, {in: path, name: ordinal, required: true, schema: {type: integer, minimum: 0}}], responses: {'200': {description: Part receipt}}}
  /v1/agent-inputs/{inputId}/finalize:
    post: {tags: [Agent Inputs], operationId: finalizeAgentInput, summary: Freeze the exact input manifest and enqueue deterministic compilation, parameters: [{$ref: '#/components/parameters/inputId'}], responses: {'200': {description: Frozen manifest identity}}}
  /v1/agent-inputs/{inputId}:
    get: {tags: [Agent Inputs], operationId: getAgentInput, parameters: [{$ref: '#/components/parameters/inputId'}], responses: {'200': {description: Input status}}}
  /v1/agent-inputs/{inputId}/manifest:
    get: {tags: [Agent Inputs], operationId: getAgentInputManifest, parameters: [{$ref: '#/components/parameters/inputId'}], responses: {'200': {description: Checksum-bound manifest}}}
  /v1/agent-inputs/{inputId}/requirements:
    get: {tags: [Agent Inputs], operationId: getAgentInputRequirements, parameters: [{$ref: '#/components/parameters/inputId'}], responses: {'200': {description: Constraint ledger}}}
  /v1/qualification-workloads:
    post: {tags: [CPU Qualification], operationId: createQualificationWorkload, summary: Partition one frozen input into deterministic multinode CPU work, requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/QualificationWorkloadCreate'}}}}, responses: {'202': {description: Durable qualification workload, content: {application/json: {schema: {$ref: '#/components/schemas/QualificationWorkload'}}}}, '409': {description: Input is not frozen or idempotency conflicts}}}
  /v1/qualification-workloads/{workloadId}:
    get: {tags: [CPU Qualification], operationId: getQualificationWorkload, summary: Get exact partition progress and deterministic result root, parameters: [{$ref: '#/components/parameters/workloadId'}], responses: {'200': {description: Qualification workload, content: {application/json: {schema: {$ref: '#/components/schemas/QualificationWorkload'}}}}, '404': {description: Not found within the authenticated tenant}}}
  /v1/qualification-workloads/{workloadId}/checkpoints:
    get: {tags: [CPU Qualification], operationId: getQualificationCheckpoints, summary: List immutable per-partition checkpoint evidence, parameters: [{$ref: '#/components/parameters/workloadId'}], responses: {'200': {description: Ordered checkpoint evidence, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/QualificationCheckpoint'}}}}}}}
  /v1/qualification-workloads/{workloadId}/cancel:
    post: {tags: [CPU Qualification], operationId: cancelQualificationWorkload, summary: Cancel all uncommitted partitions without deleting evidence, parameters: [{$ref: '#/components/parameters/workloadId'}], responses: {'200': {description: Cancelled workload, content: {application/json: {schema: {$ref: '#/components/schemas/QualificationWorkload'}}}}, '409': {description: Workload is already terminal}}}
  /v1/agent-executions:
    post: {tags: [Managed Agents], operationId: executeManagedAgent, summary: Run a model proposal loop and issue an answer certificate only when every RDF claim is entailed, responses: {'200': {description: Certified agent answer}, '422': {description: No answer returned because certification failed}}}
  /v1/tool-providers:
    post: {tags: [Tenant Tools], operationId: registerToolProvider, summary: Register an immutable pending tenant MCP provider, responses: {'201': {description: Pending provider receipt}}}
  /v1/tool-providers/{providerId}/versions/{version}/qualify:
    post: {tags: [Tenant Tools], operationId: qualifyToolProvider, summary: Perform live MCP initialization and catalog qualification, parameters: [{$ref: '#/components/parameters/providerId'}, {in: path, name: version, required: true, schema: {type: integer, minimum: 1}}], responses: {'200': {description: Qualified checksum-bound tool catalog}}}
  /v1/tool-approvals:
    post: {tags: [Tenant Tools], operationId: recordToolApproval, summary: Record an immutable scoped approval or denial, responses: {'201': {description: Approval receipt}}}
  /v1/tool-calls:
    post: {tags: [Tenant Tools], operationId: invokeQualifiedTool, summary: Invoke one catalog-qualified tool with bounded transport, responses: {'200': {description: UNTRUSTED_EXTERNAL_TOOL result}, '409': {description: Approval required}}}
  /v1/memories:
    post: {tags: [Agent Memory], operationId: proposeMemory, x-mcp-tool: ngkg_memory_propose, summary: Propose immutable working, episodic, semantic, procedural or evidence memory, requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MemoryProposal'}}}}, responses: {'201': {$ref: '#/components/responses/MemoryView'}, '422': {description: Poisoning or evidence rejected}}}
  /v1/memories/search:
    post: {tags: [Agent Memory], operationId: searchMemories, x-mcp-tool: ngkg_memory_search, summary: Search only authorized, current and unexpired memory, requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MemorySearch'}}}}, responses: {'200': {description: Memory array, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/MemoryView'}}}}}}}
  /v1/memories/{memoryId}:
    get: {tags: [Agent Memory], operationId: getMemory, summary: Read an exact authorized memory version, parameters: [{$ref: '#/components/parameters/memoryId'}], responses: {'200': {$ref: '#/components/responses/MemoryView'}}}
  /v1/memories/{memoryId}/explain:
    get: {tags: [Agent Memory], operationId: explainMemory, x-mcp-tool: ngkg_memory_explain, summary: Explain provenance, transitions, edges and inclusion/exclusion policy, parameters: [{$ref: '#/components/parameters/memoryId'}], responses: {'200': {description: Memory explanation}}}
  /v1/memories/{memoryId}/validate:
    post: {tags: [Agent Memory], operationId: validateMemory, x-mcp-tool: ngkg_memory_validate, summary: Structurally validate memory and re-entail semantic statements through NGKG, parameters: [{$ref: '#/components/parameters/memoryId'}], responses: {'200': {description: Validation and proof evidence}, '422': {description: Unknown or evidence mismatch}}}
  /v1/memories/{memoryId}/approve:
    post: {tags: [Agent Memory], operationId: approveMemory, x-mcp-tool: ngkg_memory_approve, summary: Approve an entailed semantic memory for publication activation, parameters: [{$ref: '#/components/parameters/memoryId'}], requestBody: {$ref: '#/components/requestBodies/Reason'}, responses: {'200': {$ref: '#/components/responses/MemoryView'}}}
  /v1/memories/{memoryId}/publish:
    post: {tags: [Agent Memory], operationId: publishMemory, x-mcp-tool: ngkg_memory_publish, summary: Activate semantic memory only after re-entailment in an atomically published NGKG snapshot, parameters: [{$ref: '#/components/parameters/memoryId'}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MemoryPublication'}}}}, responses: {'200': {description: Publication receipt}, '422': {description: Not entailed; no activation}}}
  /v1/memories/{memoryId}/supersede:
    post: {tags: [Agent Memory], operationId: supersedeMemory, x-mcp-tool: ngkg_memory_supersede, summary: Exclude an older memory using an immutable supersession edge, parameters: [{$ref: '#/components/parameters/memoryId'}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MemorySupersede'}}}}, responses: {'200': {$ref: '#/components/responses/MemoryView'}}}
  /v1/memories/{memoryId}/revoke:
    post: {tags: [Agent Memory], operationId: revokeMemory, x-mcp-tool: ngkg_memory_revoke, summary: Revoke and exclude a memory without deleting history, parameters: [{$ref: '#/components/parameters/memoryId'}], requestBody: {$ref: '#/components/requestBodies/Reason'}, responses: {'200': {$ref: '#/components/responses/MemoryView'}}}
components:
  securitySchemes: {bearerAuth: {type: http, scheme: bearer}}
  parameters:
    datasetId: {in: path, name: datasetId, required: true, schema: {type: string, format: uuid}}
    queryExecutionId: {in: path, name: queryExecutionId, required: true, schema: {type: string, format: uuid}}
    inputId: {in: path, name: inputId, required: true, schema: {type: string, format: uuid}}
    providerId: {in: path, name: providerId, required: true, schema: {type: string, format: uuid}}
    memoryId: {in: path, name: memoryId, required: true, schema: {type: string, format: uuid}}
    workloadId: {in: path, name: workloadId, required: true, schema: {type: string, format: uuid}}
  requestBodies:
    Reason: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MemoryReason'}}}}
  responses:
    Unauthorized: {description: Missing or invalid bearer identity}
    DependencyFailure: {description: Required dependency failed closed}
    SemanticEnvelope: {description: Complete checksum-bound reasoned context envelope}
    MemoryView: {description: Exact authorized memory, content: {application/json: {schema: {$ref: '#/components/schemas/MemoryView'}}}}
  schemas:
    QueryRequest:
      type: object
      additionalProperties: false
      required: [query, hydrate]
      properties: {query: {type: string, minLength: 1}, snapshotId: {type: [string, 'null'], format: uuid}, hydrate: {type: boolean}, defaultGraphUris: {type: array, items: {type: string, format: uri}}, namedGraphUris: {type: array, items: {type: string, format: uri}}}
    MemoryClass: {enum: [WORKING, EPISODIC, SEMANTIC, PROCEDURAL, EVIDENCE]}
    MemoryState: {enum: [PROPOSED, VALIDATING, VALIDATED, ENTAILED, CONTRADICTED, UNKNOWN, APPROVAL_REQUIRED, APPROVED, PUBLISHED, SUPERSEDED, REVOKED, REJECTED, EXPIRED]}
    Hash: {type: string, pattern: '^[0-9a-f]{64}$'}
    MemoryProposal:
      type: object
      additionalProperties: false
      required: [memoryClass, audience, contentType, content, provenance, retentionDays, legalHold, idempotencyKey]
      properties: {memoryClass: {$ref: '#/components/schemas/MemoryClass'}, audience: {enum: [OWNER, TENANT]}, contentType: {enum: [text/plain, application/json, application/n-triples]}, content: {type: string, minLength: 1, maxLength: 1048576}, sourceExecutionId: {type: [string, 'null'], format: uuid}, datasetId: {type: [string, 'null'], format: uuid}, snapshotId: {type: [string, 'null'], format: uuid}, authorizedGraphSetSha256: {oneOf: [{$ref: '#/components/schemas/Hash'}, {type: 'null'}]}, semanticResultSha256: {oneOf: [{$ref: '#/components/schemas/Hash'}, {type: 'null'}]}, answerCertificateSha256: {oneOf: [{$ref: '#/components/schemas/Hash'}, {type: 'null'}]}, provenance: {type: object}, retentionDays: {type: integer, minimum: 1, maximum: 3650}, legalHold: {type: boolean}, expiresAtEpochMs: {type: [integer, 'null']}, idempotencyKey: {type: string, minLength: 8, maxLength: 256}}
    MemoryView:
      type: object
      additionalProperties: false
      required: [memoryId, memoryClass, audience, state, stateVersion, version, ownerSubject, contentType, content, contentSha256, provenance, retentionDays, legalHold, createdAtEpochMs, updatedAtEpochMs]
      properties: {memoryId: {type: string, format: uuid}, memoryClass: {$ref: '#/components/schemas/MemoryClass'}, audience: {enum: [OWNER, TENANT]}, state: {$ref: '#/components/schemas/MemoryState'}, stateVersion: {type: integer}, version: {type: integer}, ownerSubject: {type: string}, contentType: {enum: [text/plain, application/json, application/n-triples]}, content: {type: string}, contentSha256: {$ref: '#/components/schemas/Hash'}, sourceExecutionId: {type: [string, 'null'], format: uuid}, datasetId: {type: [string, 'null'], format: uuid}, snapshotId: {type: [string, 'null'], format: uuid}, authorizedGraphSetSha256: {oneOf: [{$ref: '#/components/schemas/Hash'}, {type: 'null'}]}, semanticResultSha256: {oneOf: [{$ref: '#/components/schemas/Hash'}, {type: 'null'}]}, answerCertificateSha256: {oneOf: [{$ref: '#/components/schemas/Hash'}, {type: 'null'}]}, provenance: {type: object}, retentionDays: {type: integer}, legalHold: {type: boolean}, expiresAtEpochMs: {type: [integer, 'null']}, createdAtEpochMs: {type: integer}, updatedAtEpochMs: {type: integer}}
    MemorySearch: {type: object, additionalProperties: false, properties: {query: {type: string, maxLength: 4096}, memoryClass: {$ref: '#/components/schemas/MemoryClass'}, limit: {type: integer, minimum: 1, maximum: 100, default: 20}}}
    MemoryReason: {type: object, additionalProperties: false, required: [reasonCode], properties: {reasonCode: {type: string, pattern: '^[A-Z0-9_]{1,128}$'}}}
    MemoryPublication: {type: object, additionalProperties: false, required: [ngkgOperationId, publishedSnapshotId], properties: {ngkgOperationId: {type: string, format: uuid}, publishedSnapshotId: {type: string, format: uuid}}}
    MemorySupersede: {type: object, additionalProperties: false, required: [supersedingMemoryId, reasonCode], properties: {supersedingMemoryId: {type: string, format: uuid}, reasonCode: {type: string, pattern: '^[A-Z0-9_]{1,128}$'}}}
    QualificationWorkloadCreate: {type: object, additionalProperties: false, required: [inputId, idempotencyKey], properties: {inputId: {type: string, format: uuid}, idempotencyKey: {type: string, minLength: 8, maxLength: 256}, maximumAttempts: {type: integer, minimum: 1, maximum: 20, default: 5}, maximumPartitionBytes: {type: integer, minimum: 1, maximum: 1073741824, default: 67108864}, maximumSpillBytes: {type: integer, minimum: 1, maximum: 4398046511104, default: 8589934592}}}
    QualificationWorkload: {type: object, additionalProperties: false, required: [workloadId, component, kernel, state, stateVersion, totalPartitions, completedPartitions, failedPartitions, createdAtEpochMs, updatedAtEpochMs], properties: {workloadId: {type: string, format: uuid}, component: {const: QUALIFICATION}, kernel: {const: CANONICAL_LINESET_V1}, state: {enum: [READY, RUNNING, COMPLETED, FAILED, CANCELLED]}, stateVersion: {type: integer}, totalPartitions: {type: integer}, completedPartitions: {type: integer}, failedPartitions: {type: integer}, resultRootSha256: {oneOf: [{$ref: '#/components/schemas/Hash'}, {type: 'null'}]}, createdAtEpochMs: {type: integer}, updatedAtEpochMs: {type: integer}}}
    QualificationCheckpoint: {type: object, additionalProperties: false, required: [partitionOrdinal, sequence, checkpointSha256, recordsCompleted, bytesCompleted, spillBytes, createdAtEpochMs], properties: {partitionOrdinal: {type: integer}, sequence: {type: integer}, checkpointSha256: {$ref: '#/components/schemas/Hash'}, recordsCompleted: {type: integer}, bytesCompleted: {type: integer}, spillBytes: {type: integer}, createdAtEpochMs: {type: integer}}}
