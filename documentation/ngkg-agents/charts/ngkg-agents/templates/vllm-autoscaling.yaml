{{- if and .Values.vllm.enabled .Values.vllm.autoscaling.enabled }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata: {name: ngkg-vllm-backend}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: ngkg-vllm-backend}
  minReplicaCount: {{ .Values.vllm.autoscaling.minReplicas }}
  maxReplicaCount: {{ .Values.vllm.autoscaling.maxReplicas }}
  cooldownPeriod: {{ .Values.vllm.autoscaling.cooldownSeconds }}
  pollingInterval: {{ .Values.vllm.autoscaling.pollingIntervalSeconds }}
  advanced:
    restoreToOriginalReplicaCount: false
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          selectPolicy: Max
          policies: [{type: Percent, value: 100, periodSeconds: 60}, {type: Pods, value: 4, periodSeconds: 60}]
        scaleDown:
          stabilizationWindowSeconds: {{ .Values.vllm.autoscaling.cooldownSeconds }}
          selectPolicy: Min
          policies: [{type: Percent, value: 25, periodSeconds: 120}, {type: Pods, value: 1, periodSeconds: 120}]
  triggers:
    # This metric exists on the always-on CPU tier, including when no GPU pod exists.
    - type: prometheus
      metricType: AverageValue
      metadata:
        serverAddress: {{ .Values.vllm.autoscaling.prometheusServerAddress | quote }}
        metricName: ngkg_inference_waiting_requests
        query: sum(ngkg_inference_waiting_requests)
        threshold: {{ .Values.vllm.autoscaling.waitingRequestsTarget | quote }}
        activationThreshold: {{ .Values.vllm.autoscaling.activationWaitingRequests | quote }}
        ignoreNullValues: 'false'
    - type: cpu
      metricType: Utilization
      metadata: {value: {{ .Values.vllm.autoscaling.cpuTargetPercent | quote }}}
    - type: memory
      metricType: Utilization
      metadata: {value: {{ .Values.vllm.autoscaling.memoryTargetPercent | quote }}}
{{- end }}
