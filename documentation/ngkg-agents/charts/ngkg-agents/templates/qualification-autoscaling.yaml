{{- if and .Values.qualificationWorker.enabled .Values.qualificationWorker.autoscaling.enabled }}
{{- if eq .Values.qualificationWorker.autoscaling.mode "keda" }}
{{- if not .Values.serviceMonitor.enabled }}{{ fail "serviceMonitor.enabled must be true for queue-driven qualification KEDA" }}{{- end }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata: {name: ngkg-qualification-worker}
spec:
  scaleTargetRef: {name: ngkg-qualification-worker}
  minReplicaCount: 0
  maxReplicaCount: {{ .Values.qualificationWorker.autoscaling.maxReplicas }}
  pollingInterval: 15
  cooldownPeriod: 600
  fallback: {failureThreshold: 3, replicas: {{ .Values.qualificationWorker.autoscaling.minReplicas }}}
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp: {selectPolicy: Max, stabilizationWindowSeconds: 0, policies: [{type: Percent, value: 200, periodSeconds: 60}, {type: Pods, value: 20, periodSeconds: 60}]}
        scaleDown: {stabilizationWindowSeconds: 600, policies: [{type: Percent, value: 25, periodSeconds: 120}]}
  triggers:
    - type: prometheus
      metadata:
        serverAddress: {{ .Values.qualificationWorker.autoscaling.prometheusServerAddress | quote }}
        query: max(ngkg_cpu_work_ready_partitions{component="qualification"})
        threshold: {{ .Values.qualificationWorker.autoscaling.queuePartitionsPerReplica | quote }}
        activationThreshold: '1'
    - type: cpu
      metricType: Utilization
      metadata: {value: {{ .Values.qualificationWorker.autoscaling.cpuTargetPercent | quote }}}
    - type: memory
      metricType: Utilization
      metadata: {value: {{ .Values.qualificationWorker.autoscaling.memoryTargetPercent | quote }}}
{{- else }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: ngkg-qualification-worker}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: ngkg-qualification-worker}
  minReplicas: {{ .Values.qualificationWorker.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.qualificationWorker.autoscaling.maxReplicas }}
  behavior:
    scaleUp: {selectPolicy: Max, stabilizationWindowSeconds: 0, policies: [{type: Percent, value: 200, periodSeconds: 60}, {type: Pods, value: 20, periodSeconds: 60}]}
    scaleDown: {stabilizationWindowSeconds: 600, policies: [{type: Percent, value: 25, periodSeconds: 120}]}
  metrics:
    - {type: Resource, resource: {name: cpu, target: {type: Utilization, averageUtilization: {{ .Values.qualificationWorker.autoscaling.cpuTargetPercent }}}}}
    - {type: Resource, resource: {name: memory, target: {type: Utilization, averageUtilization: {{ .Values.qualificationWorker.autoscaling.memoryTargetPercent }}}}}
{{- end }}
{{- end }}
