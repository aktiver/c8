image:
  repository: ''
  digest: ''
  pullPolicy: IfNotPresent

replicaCount: 3
service:
  port: 32100

query:
  baseUrl: https://ngkg-query:32010/
  toolsEnabled: false
  allowHttpLoopback: false

# Select exactly one trust mode. Delegation never falls back to opaque.
auth:
  mode: opaque
  opaque:
    tokenSecret: ngkg-agent-query-token
    tokenSecretKey: tokens.json
    tokenFileSha256: ''
  delegation:
    issuer: ''
    audience: ''
    jwksUrl: ''
    resource: ''
    authorizationServers: []
    allowedAlgorithms: [RS256]
    requiredTyp: at+jwt
    maximumTokenLifetimeSeconds: 300
    clockSkewSeconds: 30
    jwksCacheTtlSeconds: 300
    lastKnownGoodSeconds: 300
    connectTimeoutMilliseconds: 2000
    requestTimeoutMilliseconds: 5000
    allowHttpsLoopback: false
    egressIpBlocks: []
    exchange:
      enabled: false
      endpoint: ''
      scopes: [queries:execute, agent-inputs:read, agent-inputs:write, agents:read, agents:write, agents:execute, agents:approve, tools:read, tools:write, tools:invoke, memory:read, memory:write, memory:validate, memory:approve, memory:publish, context-slices:read, context-slices:write, qualification:read, qualification:write, qualification:cancel]
      clientAuthentication: workload-identity
      clientId: ''
      clientSecret: ''
      clientSecretKey: client-secret.json
      clientSecretFileSha256: ''

database:
  runtimeSecret: ngkg-agent-database-runtime
  runtimeSecretKey: database-url
  migrationSecret: ngkg-agent-database-migration
  migrationSecretKey: database-url
  runtimeRole: ngkg_agent_runtime
  port: 5432
  maximumConnections: 16
  acquireTimeoutMilliseconds: 5000
  allowInsecureLoopback: false
  podSelector:
    app.kubernetes.io/name: postgresql
  ipBlocks: []

audit:
  serviceBuildSha256: ''

catalogMigration:
  enabled: true
  backoffLimit: 3
  activeDeadlineSeconds: 600

mcp:
  allowedHosts: []
  allowedOrigins: []
  maximumRequestBytes: 1048576
  maximumQueryBytes: 1048576
  maximumUpstreamResponseBytes: 67108864
  maximumInFlight: 32
  admissionTimeoutMilliseconds: 250
  connectTimeoutMilliseconds: 5000
  requestTimeoutMilliseconds: 120000
  maximumResultRows: 100000
  maximumContextTriples: 10000
  maximumContextBytes: 8388608

# Exact source bytes are stored through workload identity; never put cloud
# credentials in Helm values. Select s3 for EKS/RKE, azure for AKS, or gcs for GKE.
inputStorage:
  provider: s3
  s3: {bucket: '', region: '', endpoint: ''}
  azure: {container: '', account: '', endpoint: ''}
  gcs: {bucket: '', endpoint: ''}
  localTest: {root: /var/lib/ngkg-input-test}
  egressIpBlocks: []
  serviceAccountAnnotations: {}

inputApi:
  maximumPartBytes: 67108864
  maximumParts: 10000
  maximumBytes: 1099511627776

# Models remain outside NGKG's semantic authority boundary. This route is
# disabled until a checksum-bound provider Secret is supplied.
managedAgents:
  enabled: false
  providerSecret: ngkg-model-providers
  providerFileKey: providers.json
  providerFileSha256: ''
  credentialSecret: ''
  maximumSourceBytes: 67108864
  maximumRequirements: 100000
  maximumModelContextBytes: 16777216
  maximumClaims: 1000
  maximumOutputTokens: 8192
  providerEgressIpBlocks: []

# Tenant providers are immutable and must pass live MCP qualification before
# calls. Endpoint CIDRs remain operator-controlled, never tenant-controlled.
toolBroker:
  enabled: false
  credentialsSecret: ''
  credentialsFileKey: credentials.json
  credentialsFileSha256: ''
  protocolVersions: [2025-11-25, 2025-06-18]
  maximumTools: 1000
  maximumSchemaDepth: 32
  maximumCatalogBytes: 8388608
  maximumRequestBytes: 1048576
  maximumResponseBytes: 8388608
  maximumCatalogPages: 100
  maximumInFlight: 32
  connectTimeoutMilliseconds: 5000
  requestTimeoutMilliseconds: 120000
  allowClusterPrivateEndpoints: false
  externalEgressIpBlocks: []

# Durable memory is evidence-bound and tenant-isolated. Semantic memory is
# retrievable only after NGKG re-entails it in the atomically published snapshot.
memory:
  enabled: true
  maximumContentBytes: 524288
  maximumSearchResults: 100
  maximumStatements: 1000
  maximumWorkingTtlSeconds: 86400
  maximumRetentionDays: 3650

# Optional large reasoned-context artifacts. This is intentionally a separate
# workload identity and object prefix from both the MCP gateway and prompt input.
contextSlice:
  enabled: false
  port: 32120
  replicaCount: 3
  capabilitySecret: ngkg-context-capability-signer
  capabilitySecretKey: signing-key
  capabilityKeySha256: ''
  capabilityIssuer: https://ngkg-context-slice-broker/
  capabilityAudiences: [ngkg-agent-orchestrator]
  capabilityMaximumTtlSeconds: 300
  capabilityClockSkewSeconds: 15
  maximumTtlSeconds: 604800
  recoveryWindowSeconds: 86400
  chunkBytes: 67108864
  maximumRangeBytes: 67108864
  maximumChunks: 1000000
  maximumIndexBytes: 268435456
  maximumInFlightReads: 64
  maximumHashTasks: 16
  kmsKeyIdSha256: ''
  storage:
    provider: s3
    s3: {bucket: '', region: '', endpoint: ''}
    azure: {container: '', account: '', endpoint: ''}
    gcs: {bucket: '', endpoint: ''}
    localTest: {root: /var/lib/ngkg-context-test}
    serviceAccountAnnotations: {}
    egressIpBlocks: []
  resources: {requests: {cpu: '1', memory: 1Gi}, limits: {cpu: '8', memory: 8Gi}}
  autoscaling: {enabled: true, minReplicas: 3, maxReplicas: 100, cpuTargetPercent: 80, memoryTargetPercent: 80}
  scheduling: {nodeSelector: {ngkg.io/workload-class: cpu-hpc}, tolerations: []}
  gc:
    replicaCount: 2
    leaseMilliseconds: 300000
    idlePollMilliseconds: 1000
    resources: {requests: {cpu: 250m, memory: 256Mi}, limits: {cpu: '2', memory: 2Gi}}

# The always-on CPU admission tier keeps bounded model calls alive while the GPU
# Deployment and its node pool scale from zero. Its queue is the KEDA activation
# signal; CPU and RAM remain fixed at the required 80% scaling thresholds.
inferenceGateway:
  replicaCount: 3
  port: 8080
  maximumRequestBytes: 16777216
  maximumResponseBytes: 67108864
  maximumWaiting: 4096
  maximumInFlight: 256
  coldStartTimeoutMilliseconds: 900000
  readinessPollMilliseconds: 1000
  connectTimeoutMilliseconds: 2000
  upstreamTimeoutMilliseconds: 900000
  resources:
    requests: {cpu: 500m, memory: 512Mi}
    limits: {cpu: '4', memory: 4Gi}
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 50
    cpuTargetPercent: 80
    memoryTargetPercent: 80
  scheduling:
    nodeSelector: {}
    tolerations: []

# GPU engines are unreachable outside their pod-agent service. The vLLM process
# binds loopback; readiness verifies the exact served model before endpoints are
# published. Provider overlays only select pre-provisioned/autoscaled GPU nodes.
vllm:
  enabled: false
  image: {repository: '', digest: '', pullPolicy: IfNotPresent}
  model: ''
  servedModelName: ngkg-model
  port: 8000
  enginePort: 8000
  podAgentPort: 8081
  podAgentAdminPort: 8082
  tensorParallelSize: 1
  maximumModelLength: 32768
  runtimeClassName: ''
  serviceAccountAnnotations: {}
  podLabels: {}
  podAnnotations: {}
  modelCache: {enabled: false, existingClaim: '', mountPath: /models, readOnly: true}
  sharedMemorySizeLimit: 8Gi
  maximumRequestBytes: 16777216
  maximumResponseBytes: 67108864
  maximumInFlightPerPod: 256
  connectTimeoutMilliseconds: 2000
  upstreamTimeoutMilliseconds: 900000
  readinessPollMilliseconds: 2000
  startupFailureThreshold: 180
  drainTimeoutSeconds: 600
  terminationGracePeriodSeconds: 660
  modelSourceEgressIpBlocks: []
  resources:
    requests: {cpu: '4', memory: 32Gi, nvidia.com/gpu: '1'}
    limits: {cpu: '16', memory: 128Gi, nvidia.com/gpu: '1'}
  podAgentResources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: '1', memory: 1Gi}
  scheduling:
    nodeSelector: {ngkg.io/accelerator: nvidia-gpu}
    tolerations: [{key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}]
    topologyKey: topology.kubernetes.io/zone
    capacityTypeValues: []
  nodeProvisioning:
    provider: external
    poolName: ngkg-gpu
  autoscaling:
    enabled: true
    minReplicas: 0
    maxReplicas: 32
    cpuTargetPercent: 80
    memoryTargetPercent: 80
    waitingRequestsTarget: 1
    activationWaitingRequests: 0
    pollingIntervalSeconds: 15
    cooldownSeconds: 600
    prometheusServerAddress: http://prometheus-operated.monitoring.svc:9090

promptCompiler:
  replicaCount: 3
  leaseMilliseconds: 300000
  idlePollMilliseconds: 250
  targetChunkBytes: 16384
  maximumChunkBytes: 65536
  maximumChunksPerPart: 100000
  maximumRequirementsPerPart: 100000
  maximumPartBytes: 67108864
  threads: 0
  resources:
    requests: {cpu: '2', memory: 2Gi}
    limits: {cpu: '8', memory: 8Gi}
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 100
    cpuTargetPercent: 80
    memoryTargetPercent: 80
  scheduling:
    nodeSelector: {}
    tolerations: []

# REST-heavy components use the same checksum-bound binary with a route role.
# An optional Gateway API HTTPRoute sends each path to its independently scaled service.
components:
  orchestrator:
    enabled: true
    replicaCount: 3
    resources: {requests: {cpu: '1', memory: 1Gi}, limits: {cpu: '4', memory: 4Gi}}
    autoscaling: {enabled: true, minReplicas: 3, maxReplicas: 50, cpuTargetPercent: 80, memoryTargetPercent: 80}
    scheduling: {nodeSelector: {}, tolerations: []}
  memory:
    enabled: true
    replicaCount: 3
    resources: {requests: {cpu: 500m, memory: 1Gi}, limits: {cpu: '2', memory: 4Gi}}
    autoscaling: {enabled: true, minReplicas: 3, maxReplicas: 50, cpuTargetPercent: 80, memoryTargetPercent: 80}
    scheduling: {nodeSelector: {}, tolerations: []}
  toolBroker:
    enabled: true
    replicaCount: 3
    resources: {requests: {cpu: 500m, memory: 512Mi}, limits: {cpu: '2', memory: 2Gi}}
    autoscaling: {enabled: true, minReplicas: 3, maxReplicas: 50, cpuTargetPercent: 80, memoryTargetPercent: 80}
    scheduling: {nodeSelector: {}, tolerations: []}

qualificationWorker:
  enabled: true
  replicaCount: 1
  leaseMilliseconds: 300000
  idlePollMilliseconds: 250
  memoryFractionPercent: 70
  maximumPartitionBytes: 67108864
  maximumSpillBytes: 8589934592
  spillSizeLimit: 10Gi
  resources: {requests: {cpu: '4', memory: 8Gi}, limits: {cpu: '16', memory: 32Gi}}
  autoscaling:
    enabled: true
    mode: hpa
    minReplicas: 1
    maxReplicas: 200
    cpuTargetPercent: 80
    memoryTargetPercent: 80
    queuePartitionsPerReplica: 1
    prometheusServerAddress: http://prometheus-operated.monitoring.svc:9090
  scheduling:
    nodeSelector: {ngkg.io/workload-class: cpu-hpc}
    tolerations: []

gatewayApi:
  enabled: false
  parentRefs: []
  hostnames: []

resources:
  requests: {cpu: 500m, memory: 512Mi}
  limits: {cpu: 500m, memory: 512Mi}

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  cpuTargetPercent: 80
  memoryTargetPercent: 80

podDisruptionBudget:
  minAvailable: 2

scheduling:
  nodeSelector: {}
  tolerations: []
  topologyKey: kubernetes.io/hostname

networkPolicy:
  enabled: true
  ingressNamespaceSelector: {}
  ingressPodSelector: {}
  dnsNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: kube-system

serviceMonitor:
  enabled: false
  interval: 30s
  labels: {}
  ingressNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: monitoring
  ingressPodSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
