    PartitionPathExecutionRequest:
      type: object
      additionalProperties: false
      required:
      - snapshotId
      - manifestSha256
      - semanticRootSha256
      - activeDataset
      - planSha256
      - plan
      - iteration
      - storagePartition
      - action
      - frontier
      properties:
        snapshotId:
          type: string
          format: uuid
        manifestSha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        semanticRootSha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        activeDataset:
          $ref: '#/components/schemas/ResolvedDataset'
        planSha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        plan:
          $ref: '#/components/schemas/DistributedPropertyPathPlan'
        iteration:
          type: integer
          minimum: 0
          maximum: 4294967295
        storagePartition:
          type: integer
          minimum: 0
          maximum: 4294967295
        action:
          enum:
          - seed
          - expand
        frontier:
          type: array
          items:
            $ref: '#/components/schemas/PathFrontierKey'
    PartitionPathExecutionResponse:
      type: object
      additionalProperties: false
      required:
      - datasetId
      - snapshotId
      - semanticRootSha256
      - partitionManifestSha256
      - forwardAdjacencySha256
      - reverseAdjacencySha256
      - dictionarySha256
      - planSha256
      - storagePartition
      - iteration
      - workerId
      - responseSha256
      - batch
      - complete
      properties:
        datasetId:
          type: string
          format: uuid
        snapshotId:
          type: string
          format: uuid
        semanticRootSha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        partitionManifestSha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        forwardAdjacencySha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        reverseAdjacencySha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        dictionarySha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        planSha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        storagePartition:
          type: integer
          minimum: 0
          maximum: 4294967295
        iteration:
          type: integer
          minimum: 0
          maximum: 4294967295
        workerId:
          type: string
          minLength: 1
        responseSha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        batch:
          type: object
        complete:
          const: true
    HydrationResponse:
      type: object
      additionalProperties: false
      required:
      - datasetId
      - snapshotId
      - servingRootSha256
      - rows
      properties:
        datasetId:
          type: string
          format: uuid
        snapshotId:
          type: string
          format: uuid
        servingRootSha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        rows:
          type: array
          items:
            $ref: '#/components/schemas/PayloadRow'
    LocatorResponse:
      type: object
      additionalProperties: false
      required:
      - datasetId
      - snapshotId
      - servingRootSha256
      - entities
      properties:
        datasetId:
          type: string
          format: uuid
        snapshotId:
          type: string
          format: uuid
        servingRootSha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        entities:
          type: array
          items:
            $ref: '#/components/schemas/LocatedEntity'
    LocatedEntity:
      type: object
      additionalProperties: false
      required:
      - queryOrdinal
      - guid
      - records
      properties:
        queryOrdinal:
          type: integer
          minimum: 0
        guid:
          type: string
          format: uuid
        records:
          type: array
          items:
            $ref: '#/components/schemas/ShardLocatorRecord'
    ShardLocatorRecord:
      type: object
      additionalProperties: false
      required:
      - entityGuid
      - partitionIndex
      - rowGroup
      - rowInGroup
      - graphId
      - predicateId
      properties:
        entityGuid:
          type: string
          format: uuid
        partitionIndex:
          type: integer
          minimum: 0
          maximum: 4294967295
        rowGroup:
          type: integer
          minimum: 0
          maximum: 4294967295
        rowInGroup:
          type: integer
          minimum: 0
          maximum: 4294967295
        graphId:
          type: integer
          minimum: 0
        predicateId:
          type: integer
          minimum: 0
    Error:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      properties:
        code:
          type: string
        message:
          type: string
    SparqlAskResults:
      type: object
      additionalProperties: false
      required:
      - head
      - boolean
      properties:
        head:
          type: object
          additionalProperties: false
        boolean:
          type: boolean
