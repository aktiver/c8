openapi: 3.1.0
info:
  title: NGKG Exact Online Read Plane
  version: 1.0.0
  description: Exact, tenant-isolated access to the active published NGKG snapshot. Phase 39.4 accepts supported ad-hoc SPARQL
    1.1 queries on the bounded exact RDF scalar path while retaining snapshot-bound certificates for optimized query paths.
    SELECT may use the certified distributed Arrow/NVMe/Grace-join fast path only when the typed algebra proves it eligible;
    uncached or uncertified supported queries execute against the immutable authorized dataset with existing resource ceilings.
    Phase 40.13.7 binds exact online OWL Direct evidence to normal query responses. Phase 40.13.8 additionally checksum-binds
    a complete distributed algebra DAG and its deterministic partition waves; distributed certification remains disabled until
    native, differential, failure-injection, and multinode qualification gates pass. Phase 40.13.9 adds checksum-bound property-path
    NFAs, stable frontier partitions, hot-vertex splits and checkpoint ceilings while retaining the scalar property-path oracle
    until the distributed route is qualified. Phase 40.13.21 adds a durable tenant-scoped query execution ledger with principal,
    epoch timing, human duration, result disposition and Kubernetes resource-envelope evidence.
servers:
- url: /
security:
- bearerAuth: []
paths:
  /docs:
    get:
      security: []
      summary: Open the Swagger UI for this contract
      responses:
        '200':
          description: Swagger UI HTML
          content:
            text/html:
              schema:
                type: string
      operationId: getDocs
      description: This operation implements the documented "Open the Swagger UI for this contract" API capability. Use it
        when client developers need the exact running contract for code generation, testing or interactive requests. The operation
        takes no request body; success returns swagger ui html. This operational endpoint returns only the documented non-sensitive
        contract and never dataset contents or credentials.
  /openapi.yaml:
    get:
      security: []
      summary: Retrieve the canonical OpenAPI YAML
      responses:
        '200':
          description: OpenAPI 3.1 document
          content:
            application/yaml:
              schema:
                type: string
      operationId: getOpenapiYaml
      description: This operation implements the documented "Retrieve the canonical OpenAPI YAML" API capability. Use it when
        client developers need the exact running contract for code generation, testing or interactive requests. The operation
        takes no request body; success returns openapi 3.1 document. This operational endpoint returns only the documented
        non-sensitive contract and never dataset contents or credentials.
  /openapi.json:
    get:
      security: []
      summary: Retrieve the canonical OpenAPI document as JSON
      responses:
        '200':
          description: OpenAPI 3.1 document
          content:
            application/json:
              schema:
                type: object
      operationId: getOpenapiJson
      description: This operation implements the documented "Retrieve the canonical OpenAPI document as JSON" API capability.
        Use it when client developers need the exact running contract for code generation, testing or interactive requests.
        The operation takes no request body; success returns openapi 3.1 document. This operational endpoint returns only
        the documented non-sensitive contract and never dataset contents or credentials.
  /health/live:
    get:
      security: []
      summary: Report online-role process liveness
      responses:
        '204':
          description: Process is alive
      operationId: getHealthLive
      description: This operation implements the documented "Report online-role process liveness" API capability. Use it when
        Kubernetes probes and operators need to decide whether this exact process should receive traffic. The operation takes
        no request body; success returns process is alive. This operational endpoint returns only the documented non-sensitive
        contract and never dataset contents or credentials.
  /health/ready:
    get:
      security: []
      summary: Report online-role catalog readiness
      responses:
        '204':
          description: Catalog dependency is ready
        '503':
          description: Catalog dependency is unavailable
      operationId: getHealthReady
      description: This operation implements the documented "Report online-role catalog readiness" API capability. Use it
        when Kubernetes probes and operators need to decide whether this exact process should receive traffic. The operation
        takes no request body; success returns catalog dependency is ready. This operational endpoint returns only the documented
        non-sensitive contract and never dataset contents or credentials.
  /metrics:
    get:
      security: []
      summary: Prometheus admission, service-time, cache and worker-join metrics
      responses:
        '200':
          description: Prometheus text exposition without tenant or query labels
          content:
            text/plain:
              schema:
                type: string
      operationId: getMetrics
      description: This operation implements the documented "Prometheus admission, service-time, cache and worker-join metrics"
        API capability. Use it when Prometheus and platform operators need bounded operational measurements for alerting and
        autoscaling. The operation takes no request body; success returns prometheus text exposition without tenant or query
        labels. This operational endpoint returns only the documented non-sensitive contract and never dataset contents or
        credentials.
  /v1/hpc/capabilities:
    get:
      operationId: getHpcCapabilities
      summary: Inspect the authenticated query pod's bounded HPC capabilities
      description: This route reports the CPU set, mutually exclusive Rust/OpenMP thread budget, cgroup memory envelope, Parquet
        execution features and 80-percent autoscaling target used by the selected query pod. Operators use it to confirm that
        Helm resource limits became real process limits before enabling optimized execution. The operation takes no request
        body; success returns a live cgroup-derived resource and execution-capability envelope for this authenticated query
        replica. Authentication, tenant authorization, resource ceilings and documented failure responses are enforced before
        a result is accepted.
      responses:
        '200':
          description: A live cgroup-derived resource and execution-capability envelope for this authenticated query replica.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HpcCapabilities'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Error'
  /v1/query_logs:
    get:
      summary: List tenant-scoped SPARQL query executions
      description: Query users see only their own executions. Principals with query-logs:read may list all users in their
        authenticated tenant. Inputs use the documented path, query and header parameters; success returns bounded deterministic
        page of query execution records. Authentication, tenant authorization, resource ceilings and documented failure responses
        are enforced before a result is accepted.
      parameters:
      - name: datasetId
        in: query
        schema:
          type: string
          format: uuid
      - name: userId
        in: query
        schema:
          type: string
          minLength: 1
          maxLength: 256
      - name: status
        in: query
        schema:
          enum:
          - RUNNING
          - COMPLETED
          - FAILED
          - TIMED_OUT
          - CANCELLED
      - name: startedAfterEpochMs
        in: query
        schema:
          type: integer
          minimum: 0
      - name: startedBeforeEpochMs
        in: query
        schema:
          type: integer
          minimum: 0
      - name: minDurationMs
        in: query
        schema:
          type: integer
          minimum: 0
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 10000000
          default: 0
      responses:
        '200':
          description: Bounded deterministic page of query execution records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryLogPage'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Error'
      operationId: getV1QueryLogs
  /v1/query_logs/{queryExecutionId}:
    get:
      summary: Read one tenant-scoped SPARQL query execution
      parameters:
      - name: queryExecutionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Exact query execution record, subject to query-text redaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryLog'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Error'
      operationId: getV1QueryLogsQueryExecutionId
      description: This operation implements the documented "Read one tenant-scoped SPARQL query execution" API capability.
        Use it when a user or auditor needs tenant-scoped execution timing, resource attribution and outcome evidence. Inputs
        use the documented path, query and header parameters; success returns exact query execution record, subject to query-text
        redaction. Authentication, tenant authorization, resource ceilings and documented failure responses are enforced before
        a result is accepted.
  /v1/datasets/{datasetId}/sparql:
    get:
      summary: Execute a SPARQL 1.1 query through a SPARQL Protocol GET encoding
      description: Executes a supported exact query over the authenticated immutable active dataset. SERVICE operators use
        the checksum-bound tenant endpoint registry and are always uncached. Inputs use the documented path, query and header
        parameters; success returns the SparqlQuery response schema. Authentication, tenant authorization, resource ceilings
        and documented failure responses are enforced before a result is accepted.
      parameters:
      - $ref: '#/components/parameters/DatasetId'
      - $ref: '#/components/parameters/SparqlQuery'
      - $ref: '#/components/parameters/DefaultGraphUri'
      - $ref: '#/components/parameters/NamedGraphUri'
      - $ref: '#/components/parameters/SparqlAccept'
      responses:
        '200':
          $ref: '#/components/responses/SparqlQuery'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '406':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          description: Request exceeds the configured body limit
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Error'
        '504':
          $ref: '#/components/responses/Error'
      operationId: getV1DatasetsDatasetIdSparql
    post:
      summary: Execute a SPARQL 1.1 query through a SPARQL Protocol POST encoding
      description: Executes a supported exact query over the authenticated immutable active dataset. SERVICE operators use
        the checksum-bound tenant endpoint registry and are always uncached. The request body uses application/sparql-query,
        application/x-www-form-urlencoded and the schema shown below; success returns the SparqlQuery response schema. Authentication,
        tenant authorization, resource ceilings and documented failure responses are enforced before a result is accepted.
      parameters:
      - $ref: '#/components/parameters/DatasetId'
      - $ref: '#/components/parameters/DefaultGraphUri'
      - $ref: '#/components/parameters/NamedGraphUri'
      - $ref: '#/components/parameters/SparqlAccept'
      requestBody:
        required: true
        content:
          application/sparql-query:
            schema:
              type: string
              minLength: 1
            example: SELECT ?s WHERE { ?s a <https://example.org/Asset> }
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SparqlFormRequest'
      responses:
        '200':
          $ref: '#/components/responses/SparqlQuery'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '406':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          description: Request exceeds the configured body limit
        '415':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Error'
        '504':
          $ref: '#/components/responses/Error'
      operationId: postV1DatasetsDatasetIdSparql
  /v1/datasets/{datasetId}/sparql/direct/validate:
    post:
      summary: Validate OWL 2 Direct-Semantics BGP legality
      description: Parses the query through the same typed SPARQL compiler used by execution, applies authorization and SPARQL
        dataset precedence, and classifies every basic graph pattern against the checksum-bound OWL signature, datatype policy,
        profile qualification, and global consistency qualification. This is an admission/preflight endpoint only; it does
        not execute OWL Direct entailment. The request body uses application/json and the schema shown below; success returns
        snapshot-bound deterministic legality report for every bgp. Authentication, tenant authorization, resource ceilings
        and documented failure responses are enforced before a result is accepted.
      parameters:
      - $ref: '#/components/parameters/DatasetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DirectBgpValidationRequest'
      responses:
        '200':
          description: Snapshot-bound deterministic legality report for every BGP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectBgpLegalityReport'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          description: Query exceeds the configured request/query ceiling
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Error'
        '504':
          $ref: '#/components/responses/Error'
      operationId: postV1DatasetsDatasetIdSparqlDirectValidate
  /v1/datasets/{datasetId}/sparql/direct/route:
    post:
      summary: Route OWL 2 Direct-Semantics BGPs fail closed
      description: Performs the same authorized, snapshot-bound legality classification as the validation endpoint and selects
        certified semantic index, certified finite closure, exact HermiT, or illegal. Phase 40.13.6 treats unqualified index/closure
        coverage as unknown and therefore routes every legal BGP to exact HermiT; unknown is never interpreted as false. The
        request body uses application/json and the schema shown below; success returns snapshot-bound legality and fail-closed
        route decision. Authentication, tenant authorization, resource ceilings and documented failure responses are enforced
        before a result is accepted.
      parameters:
      - $ref: '#/components/parameters/DatasetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DirectBgpValidationRequest'
      responses:
        '200':
          description: Snapshot-bound legality and fail-closed route decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectEntailmentRoutingResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          description: Query exceeds the configured request/query ceiling
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Error'
        '504':
          $ref: '#/components/responses/Error'
      operationId: postV1DatasetsDatasetIdSparqlDirectRoute
  /v1/datasets/{datasetId}/sparql/service-description:
    get:
      summary: Retrieve the authenticated dataset service description
      description: Returns a fail-closed service description. Secured BasicFederatedQuery is advertised only when a checksum-bound
        endpoint registry is active. Inputs use the documented path, query and header parameters; success returns rdf 1.1
        turtle service description. Authentication, tenant authorization, resource ceilings and documented failure responses
        are enforced before a result is accepted.
      parameters:
      - $ref: '#/components/parameters/DatasetId'
      responses:
        '200':
          description: RDF 1.1 Turtle service description
          content:
            text/turtle:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Error'
        '504':
          $ref: '#/components/responses/Error'
      operationId: getV1DatasetsDatasetIdSparqlServiceDescription
  /v1/datasets/{datasetId}/query:
    post:
      summary: Execute an exact SPARQL query through the NGKG JSON API
      description: Uses the same authenticated snapshot, native-cutover admission, exact-reasoning, complete-partition, and
        fail-closed result contract as the SPARQL Protocol route. The enterprise profile never silently selects the ordinary
        scalar runtime. The request body uses application/json and the schema shown below; success returns complete exact
        semantic result and optional payload. Authentication, tenant authorization, resource ceilings and documented failure
        responses are enforced before a result is accepted.
      parameters:
      - $ref: '#/components/parameters/DatasetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'
      responses:
        '200':
          description: Complete exact semantic result and optional payload
          headers:
            x-ngkg-query-execution-id:
              required: true
              schema:
                type: string
                format: uuid
              description: Durable Phase 40.13.21 query execution ledger identity.
            x-ngkg-query-cache:
              required: true
              schema:
                enum:
                - hit
                - miss
              description: Whether the complete snapshot-bound response was served from the verified query-node cache.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResponse'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          description: Request exceeds the configured body limit
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Error'
        '504':
          $ref: '#/components/responses/Error'
      operationId: postV1DatasetsDatasetIdQuery
  /v1/datasets/{datasetId}/locate:
    post:
      summary: Resolve qualified GUIDs through the checksum-verified mmap index
      parameters:
      - $ref: '#/components/parameters/DatasetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhysicalRequest'
      responses:
        '200':
          description: Exact physical addresses for every GUID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocatorResponse'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          description: Request exceeds the configured body limit
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Error'
        '504':
          $ref: '#/components/responses/Error'
      operationId: postV1DatasetsDatasetIdLocate
      description: This operation implements the documented "Resolve qualified GUIDs through the checksum-verified mmap index"
        API capability. Use it when an authorized data publisher needs to manage immutable dataset or snapshot lifecycle state.
        The request body uses application/json and the schema shown below; success returns exact physical addresses for every
        guid. Authentication, tenant authorization, resource ceilings and documented failure responses are enforced before
        a result is accepted.
  /v1/datasets/{datasetId}/fragments/{querySha256}/{fragmentId}/execute:
    post:
      summary: Execute one immutable certified graph fragment
      parameters:
      - $ref: '#/components/parameters/DatasetId'
      - name: querySha256
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9a-f]{64}$
      - name: fragmentId
        in: path
        required: true
        schema:
          type: string
          pattern: ^fragment-[0-9]{4}$
      - name: Accept
        in: header
        required: true
        schema:
          const: application/vnd.apache.arrow.stream
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FragmentExecutionRequest'
      responses:
        '200':
          description: Exact fragment bag verified against its offline certificate. The Arrow schema metadata binds dataset,
            snapshot, query, fragment, worker and multiset identities; each variable uses kind, value, datatype and language
            columns.
          content:
            application/vnd.apache.arrow.stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          description: Request exceeds the configured body limit
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Error'
        '504':
          $ref: '#/components/responses/Error'
      operationId: postV1DatasetsDatasetIdFragmentsQuerySha256FragmentIdExecute
      description: This operation implements the documented "Execute one immutable certified graph fragment" API capability.
        Use it when an authorized data publisher needs to manage immutable dataset or snapshot lifecycle state. The request
        body uses application/json and the schema shown below; success returns exact fragment bag verified against its offline
        certificate. Authentication, tenant authorization, resource ceilings and documented failure responses are enforced
        before a result is accepted.
  /v1/datasets/{datasetId}/shuffles/{querySha256}/{stage}/{partition}/join:
    post:
      summary: Execute one exact hash-owned join partition
      parameters:
      - $ref: '#/components/parameters/DatasetId'
      - name: querySha256
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9a-f]{64}$
      - name: stage
        in: path
        required: true
        schema:
          type: integer
          minimum: 0
      - name: partition
        in: path
        required: true
        schema:
          type: integer
          minimum: 0
      - name: Accept
        in: header
        required: true
        schema:
          const: application/vnd.apache.arrow.stream
      requestBody:
        required: true
        content:
          application/vnd.apache.arrow.stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Exact SPARQL bag join for one plan-, stage- and hash-owned partition. Both input relations and every
            output row must carry the same fully bound join key and resolve to the partition in the request path.
          content:
            application/vnd.apache.arrow.stream:
              schema:
                type: string
                format: binary
          headers:
            x-ngkg-worker-input-mode:
              required: true
              schema:
                enum:
                - streamed_spool_v1
              description: Worker consumed the request through its bounded local-NVMe spool.
            x-ngkg-worker-input-bytes:
              required: true
              schema:
                type: integer
                minimum: 1
              description: Exact Arrow request bytes durably received and validated.
            x-ngkg-worker-input-sha256:
              required: true
              schema:
                type: string
                pattern: ^[0-9a-f]{64}$
              description: SHA-256 of the exact Arrow request body received by the worker.
            x-ngkg-shuffle-cache:
              required: true
              schema:
                enum:
                - hit
                - miss
              description: Whether this exact immutable partition result was reused.
            x-ngkg-worker-join-mode:
              required: true
              schema:
                enum:
                - in_memory_hash_v1
                - grace_hash_nvme_v1
              description: Exact worker-local physical join algorithm.
            x-ngkg-worker-join-spill-bytes:
              required: true
              schema:
                type: integer
                minimum: 0
              description: Checksum-protected local-NVMe bytes used by the original computation.
            x-ngkg-worker-join-buckets:
              required: true
              schema:
                type: integer
                minimum: 0
              description: Non-empty Grace buckets replayed by the original computation.
            x-ngkg-worker-join-max-build-rows:
              required: true
              schema:
                type: integer
                minimum: 0
              description: Largest right-side hash-build chunk loaded by the worker.
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          description: Request exceeds the configured body limit
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Error'
        '504':
          $ref: '#/components/responses/Error'
      operationId: postV1DatasetsDatasetIdShufflesQuerySha256StagePartitionJoin
      description: This operation implements the documented "Execute one exact hash-owned join partition" API capability.
        Use it when an authorized data publisher needs to manage immutable dataset or snapshot lifecycle state. The request
        body uses application/vnd.apache.arrow.stream and the schema shown below; success returns exact sparql bag join for
        one plan-, stage- and hash-owned partition. Authentication, tenant authorization, resource ceilings and documented
        failure responses are enforced before a result is accepted.
  /v1/datasets/{datasetId}/hydrate:
    post:
      summary: Hydrate qualified GUIDs from exact Parquet row groups
      parameters:
      - $ref: '#/components/parameters/DatasetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhysicalRequest'
      responses:
        '200':
          description: Payload rows with semantic result ordinals preserved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HydrationResponse'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          description: Request exceeds the configured body limit
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Error'
        '504':
          $ref: '#/components/responses/Error'
      operationId: postV1DatasetsDatasetIdHydrate
      description: This operation implements the documented "Hydrate qualified GUIDs from exact Parquet row groups" API capability.
        Use it when an authorized data publisher needs to manage immutable dataset or snapshot lifecycle state. The request
        body uses application/json and the schema shown below; success returns payload rows with semantic result ordinals
        preserved. Authentication, tenant authorization, resource ceilings and documented failure responses are enforced before
        a result is accepted.
  /v1/datasets/{datasetId}/algebra/{querySha256}/{replica}/execute:
    post:
      summary: Execute one checksum-bound complete SPARQL algebra replica
      description: Executes the complete rewritten typed algebra with the pinned scalar oracle. The query coordinator requires
        a dense set of distinct replicas with byte-equivalent canonical results before returning any answer. The request body
        uses application/json and the schema shown below; success returns one complete scalar-oracle result replica; this
        response is not independently publishable. Authentication, tenant authorization, resource ceilings and documented
        failure responses are enforced before a result is accepted.
      parameters:
      - $ref: '#/components/parameters/DatasetId'
      - name: querySha256
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9a-f]{64}$
      - name: replica
        in: path
        required: true
        schema:
          type: integer
          minimum: 0
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DistributedAlgebraExecutionRequest'
      responses:
        '200':
          description: One complete scalar-oracle result replica; this response is not independently publishable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DistributedAlgebraExecutionResponse'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          description: Request exceeds the configured body limit
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Error'
        '504':
          $ref: '#/components/responses/Error'
      operationId: postV1DatasetsDatasetIdAlgebraQuerySha256ReplicaExecute
  /v1/datasets/{datasetId}/paths/{querySha256}/{pathId}/{iteration}/{partition}/expand:
    post:
      summary: Execute one immutable semantic-partition property-path scan
      description: Internal fragment-worker operation. It checksum-validates the active semantic root, dense dictionary and
        forward/reverse adjacency artifacts before seeding or expanding one exact property-path frontier. The request body
        uses application/json and the schema shown below; success returns complete checksum-bound seed or expansion result
        for exactly one semantic partition. Authentication, tenant authorization, resource ceilings and documented failure
        responses are enforced before a result is accepted.
      parameters:
      - $ref: '#/components/parameters/DatasetId'
      - name: querySha256
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9a-f]{64}$
      - name: pathId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
      - name: iteration
        in: path
        required: true
        schema:
          type: integer
          minimum: 0
          maximum: 4294967295
      - name: partition
        in: path
        required: true
        schema:
          type: integer
          minimum: 0
          maximum: 4294967295
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartitionPathExecutionRequest'
      responses:
        '200':
          description: Complete checksum-bound seed or expansion result for exactly one semantic partition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartitionPathExecutionResponse'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          description: Request exceeds the configured body limit
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Error'
        '504':
          $ref: '#/components/responses/Error'
      operationId: postV1DatasetsDatasetIdPathsQuerySha256PathIdIterationPartitionExpand
  /v1/datasets/{datasetId}/native/leaves/{querySha256}/{partition}/scan:
    post:
      summary: Scan one checksum-verified semantic Parquet partition
      description: Internal fragment-worker operation used by the native query runtime. The worker derives graph IDs from
        the authenticated active dataset, verifies the semantic root, partition manifest, file size and SHA-256, and applies
        dictionary-ID predicates in bounded Arrow batches. The request body uses application/json and the schema shown below;
        success returns complete bounded leaf result and checksum evidence for exactly one partition. Authentication, tenant
        authorization, resource ceilings and documented failure responses are enforced before a result is accepted.
      parameters:
      - $ref: '#/components/parameters/DatasetId'
      - name: querySha256
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9a-f]{64}$
      - name: partition
        in: path
        required: true
        schema:
          type: integer
          minimum: 0
          maximum: 4294967295
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NativeLeafScanRequest'
      responses:
        '200':
          description: Complete bounded leaf result and checksum evidence for exactly one partition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NativeLeafScanResponse'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          description: Request exceeds the configured body limit
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Error'
        '504':
          $ref: '#/components/responses/Error'
      operationId: postV1DatasetsDatasetIdNativeLeavesQuerySha256PartitionScan
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    DatasetId:
      name: datasetId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SparqlQuery:
      name: query
      in: query
      required: true
      allowEmptyValue: false
      schema:
        type: string
        minLength: 1
    DefaultGraphUri:
      name: default-graph-uri
      in: query
      required: false
      description: Repeated SPARQL Protocol default graph IRI. When any protocol dataset parameter is supplied, the protocol
        dataset replaces query FROM/FROM NAMED clauses and the configured union-default dataset.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          format: uri
    NamedGraphUri:
      name: named-graph-uri
      in: query
      required: false
      description: Repeated SPARQL Protocol named graph IRI. When any protocol dataset parameter is supplied, the protocol
        dataset replaces query FROM/FROM NAMED clauses and the configured union-default dataset.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          format: uri
    SparqlAccept:
      name: Accept
      in: header
      required: false
      description: RFC media-range negotiation. SELECT and ASK support application/sparql-results+json, application/sparql-results+xml,
        text/tab-separated-values and text/csv. CONSTRUCT and DESCRIBE support text/turtle, application/n-triples and application/rdf+xml.
      schema:
        type: string
  responses:
    Error:
      description: Fail-closed error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: A bounded global or authenticated-tenant execution lane remained full through the admission deadline
      headers:
        Retry-After:
          required: true
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    SparqlQuery:
      description: Complete SPARQL 1.1 result; local results may be certificate-validated, while SERVICE results are uncached
      headers:
        x-ngkg-query-execution-id:
          required: true
          schema:
            type: string
            format: uuid
        x-ngkg-query-cache:
          required: true
          schema:
            enum:
            - hit
            - miss
        x-ngkg-snapshot-id:
          required: true
          schema:
            type: string
            format: uuid
        x-ngkg-query-sha256:
          required: true
          schema:
            type: string
            pattern: ^[0-9a-f]{64}$
        x-ngkg-semantic-result-sha256:
          description: Format-independent canonical hash of the complete SPARQL result under the query's ordering semantics.
          required: true
          schema:
            type: string
            pattern: ^[0-9a-f]{64}$
        x-ngkg-native-cutover-mode:
          description: Serving policy used for this request; production qualification requires `required`.
          required: true
          schema:
            enum:
            - disabled
            - shadow
            - required
        x-ngkg-complete:
          required: true
          schema:
            const: 'true'
        x-ngkg-federation-registry-sha256:
          description: Present only for SERVICE queries.
          schema:
            type: string
            pattern: ^[0-9a-f]{64}$
        x-ngkg-federation-call-count:
          description: Present only for SERVICE queries.
          schema:
            type: integer
            minimum: 0
        x-ngkg-federation-endpoint-set-sha256:
          description: Present only for SERVICE queries.
          schema:
            type: string
            pattern: ^[0-9a-f]{64}$
      content:
        application/sparql-results+json:
          schema:
            oneOf:
            - $ref: '#/components/schemas/SparqlSelectResults'
            - $ref: '#/components/schemas/SparqlAskResults'
        application/sparql-results+xml:
          schema:
            type: string
        text/tab-separated-values:
          schema:
            type: string
        text/csv:
          schema:
            type: string
        text/turtle:
          schema:
            type: string
        application/n-triples:
          schema:
            type: string
        application/rdf+xml:
          schema:
            type: string
  schemas:
    HpcCapabilities:
      type: object
      additionalProperties: false
      required:
      - formatVersion
      - role
      - workerId
      - local
      - memory
      - parquet
      - mpi
      - autoscalingTargetPercent
      properties:
        formatVersion:
          const: 1
        role:
          enum:
          - query
        workerId:
          type: string
          minLength: 1
        autoscalingTargetPercent:
          type: integer
          minimum: 1
          maximum: 80
        local:
          type: object
          additionalProperties: false
          required:
          - cpusetCores
          - cpusetSource
          - budget
          - nodeSaturationTargetPercent
          - ompNumThreads
          - openblasNumThreads
          - mklNumThreads
          properties:
            cpusetCores:
              type: integer
              minimum: 1
            cpusetSource:
              type: string
              minLength: 1
            nodeSaturationTargetPercent:
              type: integer
              minimum: 1
              maximum: 80
            ompNumThreads:
              type: integer
              minimum: 1
            openblasNumThreads:
              type: integer
              minimum: 1
            mklNumThreads:
              type: integer
              minimum: 1
            budget:
              type: object
              additionalProperties: false
              required:
              - rustCompute
              - blockingIo
              - openmp
              - blas
              - control
              properties:
                rustCompute:
                  type: integer
                  minimum: 1
                blockingIo:
                  type: integer
                  minimum: 1
                openmp:
                  type: integer
                  minimum: 1
                blas:
                  type: integer
                  minimum: 1
                control:
                  type: integer
                  minimum: 1
        memory:
          type: object
          additionalProperties: false
          required:
          - cpusetCores
          - cpusetSource
          - memoryLimitBytes
          - memoryCurrentBytes
          - usableMemoryBytes
          - memoryHeadroomBytes
          - saturationTargetPercent
          - memorySaturated
          properties:
            cpusetCores:
              type: integer
              minimum: 1
            cpusetSource:
              type: string
              minLength: 1
            memoryLimitBytes:
              type: integer
              minimum: 1
            memoryCurrentBytes:
              type: integer
              minimum: 0
            usableMemoryBytes:
              type: integer
              minimum: 1
            memoryHeadroomBytes:
              type: integer
              minimum: 0
            saturationTargetPercent:
              type: integer
              minimum: 1
              maximum: 80
            memorySaturated:
              type: boolean
        parquet:
          type: object
          additionalProperties: false
          required:
          - projectedColumns
          - boundedArrowBatches
          - deterministicRankReceipts
          - executionModes
          properties:
            projectedColumns:
              const: true
            boundedArrowBatches:
              const: true
            deterministicRankReceipts:
              const: true
            executionModes:
              type: array
              minItems: 1
              uniqueItems: true
              items:
                enum:
                - rust
                - openmp
        mpi:
          type: object
          additionalProperties: false
          required:
          - onlineQueryParticipant
          - finiteBatchSupported
          - oneRankPerPod
          - elasticRankResize
          properties:
            onlineQueryParticipant:
              const: false
            finiteBatchSupported:
              const: true
            oneRankPerPod:
              const: true
            elasticRankResize:
              const: false
    QueryLogPage:
      type: object
      additionalProperties: false
      required:
      - items
      - limit
      - offset
      - hasMore
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/QueryLog'
        limit:
          type: integer
          minimum: 1
          maximum: 1000
        offset:
          type: integer
          minimum: 0
        hasMore:
          type: boolean
    QueryLog:
      type: object
      additionalProperties: false
      required:
      - queryExecutionId
      - datasetId
      - requestId
      - user
      - querySha256
      - status
      - resources
      - timing
      properties:
        queryExecutionId:
          type: string
          format: uuid
        datasetId:
          type: string
          format: uuid
        snapshotId:
          type:
          - string
          - 'null'
          format: uuid
        requestId:
          type: string
          minLength: 1
          maxLength: 128
        user:
          type: object
          additionalProperties: false
          required:
          - principalId
          properties:
            principalId:
              type: string
              minLength: 1
              maxLength: 256
        sparqlQuery:
          type:
          - string
          - 'null'
          description: Redacted unless the caller owns the query or has query-logs:read:text.
        querySha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        queryForm:
          type:
          - string
          - 'null'
          enum:
          - SELECT
          - ASK
          - CONSTRUCT
          - DESCRIBE
          - null
        executionMode:
          type:
          - string
          - 'null'
        status:
          enum:
          - RUNNING
          - COMPLETED
          - FAILED
          - TIMED_OUT
          - CANCELLED
        resources:
          $ref: '#/components/schemas/QueryLogResources'
        timing:
          $ref: '#/components/schemas/QueryLogTiming'
        resultRows:
          type:
          - integer
          - 'null'
          minimum: 0
        resultBytes:
          type:
          - integer
          - 'null'
          minimum: 0
        cacheHit:
          type:
          - boolean
          - 'null'
        errorCode:
          type:
          - string
          - 'null'
    QueryLogResources:
      type: object
      additionalProperties: false
      required:
      - participatingPods
      - participatingNodes
      - requestedCpuMillicores
      - requestedRamBytes
      - allocatedCpuMillicores
      - allocatedRamBytes
      - measuredCpuTimeMs
      - measuredPeakRssBytes
      - measuredGpuTimeMs
      - measuredGpuPeakMemoryBytes
      - measurementScope
      - autoscalingEvents
      properties:
        participatingPods:
          type: array
          uniqueItems: true
          items:
            type: string
          description: Kubernetes pod UIDs contributing measurement evidence.
        participatingNodes:
          type: array
          uniqueItems: true
          items:
            type: string
          description: Kubernetes node UIDs contributing measurement evidence.
        requestedCpuMillicores:
          type:
          - integer
          - 'null'
          minimum: 1
        requestedRamBytes:
          type:
          - integer
          - 'null'
          minimum: 1
        allocatedCpuMillicores:
          type:
          - integer
          - 'null'
          minimum: 1
        allocatedRamBytes:
          type:
          - integer
          - 'null'
          minimum: 1
        measuredCpuTimeMs:
          type:
          - integer
          - 'null'
          minimum: 0
          description: Actual cgroup CPU usage delta over the execution interval; scope identifies coverage.
        measuredPeakRssBytes:
          type:
          - integer
          - 'null'
          minimum: 0
        measuredGpuTimeMs:
          type:
          - integer
          - 'null'
          minimum: 0
        measuredGpuPeakMemoryBytes:
          type:
          - integer
          - 'null'
          minimum: 0
        measurementScope:
          enum:
          - COORDINATOR_CGROUP_INTERVAL
          - ALL_PARTICIPANTS
          - UNAVAILABLE
        autoscalingEvents:
          type: array
          items:
            type: object
    QueryLogTiming:
      type: object
      additionalProperties: false
      required:
      - startTimeEpoch
      - startTimeEpochMs
      - endTimeEpoch
      - endTimeEpochMs
      - totalTimeMs
      - totalTime
      properties:
        startTimeEpoch:
          type: integer
          minimum: 1
          description: Unix epoch seconds.
        startTimeEpochMs:
          type: integer
          minimum: 1
        endTimeEpoch:
          type:
          - integer
          - 'null'
          minimum: 1
          description: Unix epoch seconds.
        endTimeEpochMs:
          type:
          - integer
          - 'null'
          minimum: 1
        totalTimeMs:
          type:
          - integer
          - 'null'
          minimum: 0
        totalTime:
          type:
          - string
          - 'null'
          pattern: ^[0-9]+min [0-5][0-9]s$
    SparqlFormRequest:
      type: object
      additionalProperties: false
      required:
      - query
      properties:
        query:
          type: string
          minLength: 1
        default-graph-uri:
          type: array
          items:
            type: string
            format: uri
        named-graph-uri:
          type: array
          items:
            type: string
            format: uri
    SparqlSelectResults:
      type: object
      additionalProperties: false
      required:
      - head
      - results
      properties:
        head:
          type: object
          additionalProperties: false
          required:
          - vars
          properties:
            vars:
              type: array
              uniqueItems: true
              items:
                type: string
        results:
          type: object
          additionalProperties: false
          required:
          - bindings
          properties:
            bindings:
              type: array
              items:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/SparqlTerm'
    SparqlTerm:
      oneOf:
      - type: object
        additionalProperties: false
        required:
        - type
        - value
        properties:
          type:
            const: uri
          value:
            type: string
            minLength: 1
      - type: object
        additionalProperties: false
        required:
        - type
        - value
        properties:
          type:
            const: bnode
          value:
            type: string
            minLength: 1
      - type: object
        additionalProperties: false
        required:
        - type
        - value
        properties:
          type:
            const: literal
          value:
            type: string
          datatype:
            type: string
            format: uri
          xml:lang:
            type: string
            minLength: 1
        not:
          required:
          - datatype
          - xml:lang
    DirectBgpValidationRequest:
      type: object
      additionalProperties: false
      required:
      - query
      properties:
        query:
          type: string
          minLength: 1
        snapshotId:
          type:
          - string
          - 'null'
          format: uuid
        defaultGraphUris:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uri
        namedGraphUris:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uri
    DirectBgpLegalityReport:
      type: object
      additionalProperties: false
      required:
      - formatVersion
      - datasetId
      - snapshotId
      - querySha256
      - sparqlAlgebraSha256
      - activeDatasetSha256
      - authorizedGraphSetSha256
      - owlSignatureSha256
      - datatypePolicySha256
      - owlProfileQualificationSha256
      - owlConsistencyQualificationSha256
      - entailmentRegime
      - classifier
      - bgpCount
      - allBgpsLegal
      - propertyPathsOutsideDirectBgps
      - bgps
      properties:
        formatVersion:
          const: 1
        datasetId:
          type: string
          format: uuid
        snapshotId:
          type: string
          format: uuid
        querySha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        sparqlAlgebraSha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        activeDatasetSha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        authorizedGraphSetSha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        owlSignatureSha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        datatypePolicySha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        owlProfileQualificationSha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        owlConsistencyQualificationSha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        entailmentRegime:
          const: owl2-direct
        classifier:
          const: w3c-owl2-direct-bgp-cp1-cp4-v1
        bgpCount:
          type: integer
          minimum: 0
          maximum: 4096
        allBgpsLegal:
          type: boolean
        propertyPathsOutsideDirectBgps:
          type: boolean
        bgps:
          type: array
          maxItems: 4096
          items:
            $ref: '#/components/schemas/DirectBgpLegalityRecord'
    DirectEntailmentRoutingResponse:
      type: object
      additionalProperties: false
      required:
      - legality
      - routes
      properties:
        legality:
          $ref: '#/components/schemas/DirectBgpLegalityReport'
        routes:
          type: array
          maxItems: 4096
          items:
            type: object
            additionalProperties: false
            required:
            - ordinal
            - bgpSha256
            - route
            properties:
              ordinal:
                type: integer
                minimum: 0
              bgpSha256:
                type: string
                pattern: ^[0-9a-f]{64}$
              route:
                enum:
                - certified-semantic-index
                - certified-finite-closure
                - exact-hermit
                - illegal-owl-direct
    DirectBgpLegalityRecord:
      type: object
      additionalProperties: false
      required:
      - ordinal
      - bgpSha256
      - graphScope
      - tripleCount
      - recognizedForms
      - variables
      - status
      - groundedOwl2dlCheckRequired
      properties:
        ordinal:
          type: integer
          minimum: 0
        bgpSha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        graphScope:
          type: object
          description: Default, named, or named-variable active graph scope; shape is closed by the runtime contract schema.
        tripleCount:
          type: integer
          minimum: 0
          maximum: 65536
        recognizedForms:
          type: array
          uniqueItems: true
          items:
            type: string
        variables:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/DirectVariableTyping'
        status:
          enum:
          - legal
          - illegal
        groundedOwl2dlCheckRequired:
          const: true
        failure:
          $ref: '#/components/schemas/DirectBgpLegalityFailure'
    DirectVariableTyping:
      type: object
      additionalProperties: false
      required:
      - variable
      - role
      - source
      properties:
        variable:
          type: string
          minLength: 1
        role:
          enum:
          - class
          - object-property
          - data-property
          - annotation-property
          - datatype
          - named-individual
          - literal
        source:
          enum:
          - explicit-declaration
          - structural-position
    DirectBgpLegalityFailure:
      type: object
