[workspace]
resolver = "3"
members = [
  "crates/ngkg-api-client",
  "crates/ngkg-agent-catalog",
  "crates/ngkg-agent-input",
  "crates/ngkg-agent-memory",
  "crates/ngkg-cpu-work-plane",
  "crates/ngkg-context-slice",
  "crates/ngkg-hpc-runtime",
  "crates/ngkg-agent-orchestrator",
  "crates/ngkg-auth",
  "crates/ngkg-mcp-contracts",
  "crates/ngkg-model-provider",
  "crates/ngkg-tool-broker",
  "services/catalog-migrator",
  "services/context-slice-broker",
  "services/context-slice-gc",
  "services/mcp-gateway",
  "services/inference-gateway",
  "services/prompt-compiler",
  "services/qualification-worker",
  "services/vllm-pod-agent",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.97.1"
version = "0.10.0"

[workspace.dependencies]
anyhow = "=1.0.100"
axum = "=0.8.9"
bytes = "=1.11.0"
futures-util = "=0.3.31"
hex = "=0.4.3"
http = "=1.4.0"
object_store = { version = "=0.14.1", default-features = false, features = ["fs", "aws", "azure", "gcp"] }
rayon = "=1.12.0"
jsonwebtoken = { version = "=11.0.0", default-features = false, features = ["rust_crypto"] }
memmap2 = "=0.9.9"
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
rmcp = { version = "=3.1.4", features = ["server", "macros", "transport-streamable-http-server"] }
rmcp-macros = "=3.1.4"
schemars = { version = "=1.0.0", features = ["uuid1"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "json", "migrate", "macros"] }
thiserror = "=2.0.17"
tokio = { version = "=1.48.0", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "=0.7.17"
tower-http = { version = "=0.6.8", features = ["request-id", "trace"] }
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.20", features = ["env-filter", "json"] }
url = "=2.5.7"
uuid = { version = "=1.19.0", features = ["serde", "v4"] }

[workspace.lints.rust]
# The verified locator mapping owns one reviewed, function-scoped unsafe block.
# All other unsafe code remains denied by default.
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
case_sensitive_file_extension_comparisons = "allow"
manual_let_else = "allow"
needless_pass_by_value = "allow"
ref_option = "allow"
result_large_err = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
struct_field_names = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
