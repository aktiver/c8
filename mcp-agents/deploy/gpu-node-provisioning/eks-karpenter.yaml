# Replace role and subnet/security-group discovery tags before applying.
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata: {name: ngkg-gpu}
spec:
  role: REPLACE_WITH_KARPENTER_NODE_ROLE
  amiSelectorTerms: [{id: REPLACE_WITH_PINNED_AMI_ID}]
  subnetSelectorTerms: [{tags: {karpenter.sh/discovery: REPLACE_WITH_CLUSTER_NAME}}]
  securityGroupSelectorTerms: [{tags: {karpenter.sh/discovery: REPLACE_WITH_CLUSTER_NAME}}]
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs: {volumeSize: 200Gi, volumeType: gp3, encrypted: true, deleteOnTermination: true}
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata: {name: ngkg-gpu}
spec:
  disruption: {consolidationPolicy: WhenEmpty, consolidateAfter: 10m}
  limits: {cpu: '1000', nvidia.com/gpu: '64'}
  template:
    metadata: {labels: {ngkg.io/accelerator: nvidia-gpu}}
    spec:
      nodeClassRef: {group: karpenter.k8s.aws, kind: EC2NodeClass, name: ngkg-gpu}
      taints: [{key: ngkg.io/gpu, value: 'true', effect: NoSchedule}]
      requirements:
        - {key: kubernetes.io/arch, operator: In, values: [amd64]}
        - {key: karpenter.sh/capacity-type, operator: In, values: [on-demand, spot]}
        - {key: karpenter.k8s.aws/instance-gpu-count, operator: Gt, values: ['0']}
        - {key: karpenter.k8s.aws/instance-category, operator: In, values: [g, p]}
