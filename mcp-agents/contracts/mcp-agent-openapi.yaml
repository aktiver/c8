openapi: 3.1.0
info:
  title: NGKG MCP and Agent REST API
  version: 0.8.0
  description: Complete REST parity for NGKG semantic MCP tools, long-input compilation, managed agents, tenant tools, evidence-bound
    memory and distributed CPU qualification. Load this endpoint directly in Swagger UI.
servers:
- url: /
security:
- bearerAuth: []
tags:
- name: MCP
  description: MCP Streamable HTTP transport
- name: Semantic Query
  description: REST parity for built-in semantic MCP tools
- name: Agent Inputs
  description: Resumable long-input ingestion and deterministic compilation
- name: Managed Agents
  description: Reasoning-bound model execution
- name: Tenant Tools
  description: Qualified tenant MCP providers and calls
- name: Agent Memory
  description: Five-class evidence-bound long-term memory
- name: CPU Qualification
  description: Deterministic multinode CPU work with bounded spill and checkpoints
paths:
  /openapi.yaml:
    get:
      security: []
      tags:
      - MCP
      operationId: getOpenApiContract
      summary: Download the complete gateway OpenAPI 3.1 contract
      responses:
        '200':
          description: OpenAPI YAML
          content:
            application/yaml:
              schema:
                type: string
      description: This operation implements the documented "Download the complete gateway OpenAPI 3.1 contract" API capability.
        Use it when client developers need the exact running contract for code generation, testing or interactive requests.
        The operation takes no request body; success returns openapi yaml. This operational endpoint returns only the documented
        non-sensitive contract and never dataset contents or credentials.
  /swagger-ui:
    get:
      security: []
      tags:
      - MCP
      operationId: getSwaggerUi
      summary: Open interactive Swagger documentation for every REST-driven MCP and agent operation
      responses:
        '200':
          description: Swagger UI HTML
      description: This operation implements the documented "Open interactive Swagger documentation for every REST-driven
        MCP and agent operation" API capability. Use it when client developers need the exact running contract for code generation,
        testing or interactive requests. The operation takes no request body; success returns swagger ui html. This operational
        endpoint returns only the documented non-sensitive contract and never dataset contents or credentials.
  /mcp:
    post:
      tags:
      - MCP
      operationId: mcpStreamableHttp
      summary: MCP initialize
      tools/list and tools/call transport: null
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: MCP JSON or SSE response
        '401':
          $ref: '#/components/responses/Unauthorized'
      description: This operation implements the documented "MCP initialize" API capability. Use it when an API client needs
        this capability through the supported contract instead of coupling to an internal service. The request body uses application/json
        and the schema shown below; success returns mcp json or sse response. Authentication, tenant authorization, resource
        ceilings and documented failure responses are enforced before a result is accepted.
  /v1/datasets/{datasetId}/active-snapshot:
    get:
      tags:
      - Semantic Query
      operationId: getActiveSnapshot
      x-mcp-tool: ngkg_get_active_snapshot
      summary: Resolve the authorized active snapshot through an ASK barrier
      parameters:
      - $ref: '#/components/parameters/datasetId'
      responses:
        '200':
          $ref: '#/components/responses/SemanticEnvelope'
        '502':
          $ref: '#/components/responses/DependencyFailure'
      description: This operation implements the documented "Resolve the authorized active snapshot through an ASK barrier"
        API capability. Use it when an authorized data publisher needs to manage immutable dataset or snapshot lifecycle state.
        Inputs use the documented path, query and header parameters; success returns the SemanticEnvelope response schema.
        Authentication, tenant authorization, resource ceilings and documented failure responses are enforced before a result
        is accepted.
  /v1/datasets/{datasetId}/query:
    post:
      tags:
      - Semantic Query
      operationId: executeSemanticQuery
      x-mcp-tools:
      - ngkg_query
      - ngkg_construct_context_graph
      summary: Execute authorized snapshot-bound SPARQL and return a reasoned envelope
      parameters:
      - $ref: '#/components/parameters/datasetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'
      responses:
        '200':
          $ref: '#/components/responses/SemanticEnvelope'
        '502':
          $ref: '#/components/responses/DependencyFailure'
      description: This operation implements the documented "Execute authorized snapshot-bound SPARQL and return a reasoned
        envelope" API capability. Use it when an authorized application needs a snapshot-bound semantic answer rather than
        direct access to internal stores. The request body uses application/json and the schema shown below; success returns
        the SemanticEnvelope response schema. Authentication, tenant authorization, resource ceilings and documented failure
        responses are enforced before a result is accepted.
  /v1/query_logs/{queryExecutionId}:
    get:
      tags:
      - Semantic Query
      operationId: getQueryLog
      x-mcp-tool: ngkg_get_query_log
      summary: Get immutable query timing
      user and configured allocation evidence: null
      parameters:
      - $ref: '#/components/parameters/queryExecutionId'
      responses:
        '200':
          description: Query log and explicit resource semantics
        '502':
          $ref: '#/components/responses/DependencyFailure'
      description: This operation implements the documented "Get immutable query timing" API capability. Use it when a user
        or auditor needs tenant-scoped execution timing, resource attribution and outcome evidence. Inputs use the documented
        path, query and header parameters; success returns query log and explicit resource semantics. Authentication, tenant
        authorization, resource ceilings and documented failure responses are enforced before a result is accepted.
  /v1/agent-inputs:
    post:
      tags:
      - Agent Inputs
      operationId: createAgentInput
      summary: Create a resumable checksum-bound input session
      responses:
        '201':
          description: Input session
      description: This operation implements the documented "Create a resumable checksum-bound input session" API capability.
        Use it when a client needs to ingest or inspect a large immutable agent input and its permanent constraint ledger.
        The operation uses the documented request contract; success returns input session. Authentication, tenant authorization,
        resource ceilings and documented failure responses are enforced before a result is accepted.
  /v1/agent-inputs/{inputId}/parts/{ordinal}:
    put:
      tags:
      - Agent Inputs
      operationId: uploadAgentInputPart
      summary: Upload an idempotent input part
      parameters:
      - $ref: '#/components/parameters/inputId'
      - in: path
        name: ordinal
        required: true
        schema:
          type: integer
          minimum: 0
      responses:
        '200':
          description: Part receipt
      description: This operation implements the documented "Upload an idempotent input part" API capability. Use it when
        a client needs to ingest or inspect a large immutable agent input and its permanent constraint ledger. Inputs use
        the documented path, query and header parameters; success returns part receipt. Authentication, tenant authorization,
        resource ceilings and documented failure responses are enforced before a result is accepted.
  /v1/agent-inputs/{inputId}/finalize:
    post:
      tags:
      - Agent Inputs
      operationId: finalizeAgentInput
      summary: Freeze the exact input manifest and enqueue deterministic compilation
      parameters:
      - $ref: '#/components/parameters/inputId'
      responses:
        '200':
          description: Frozen manifest identity
      description: This operation implements the documented "Freeze the exact input manifest and enqueue deterministic compilation"
        API capability. Use it when a client needs to ingest or inspect a large immutable agent input and its permanent constraint
        ledger. Inputs use the documented path, query and header parameters; success returns frozen manifest identity. Authentication,
        tenant authorization, resource ceilings and documented failure responses are enforced before a result is accepted.
  /v1/agent-inputs/{inputId}:
    get:
      tags:
      - Agent Inputs
      operationId: getAgentInput
      parameters:
      - $ref: '#/components/parameters/inputId'
      responses:
        '200':
          description: Input status
      summary: get Agent Input
      description: This operation implements the documented "get Agent Input" API capability. Use it when a client needs to
        ingest or inspect a large immutable agent input and its permanent constraint ledger. Inputs use the documented path,
        query and header parameters; success returns input status. Authentication, tenant authorization, resource ceilings
        and documented failure responses are enforced before a result is accepted.
  /v1/agent-inputs/{inputId}/manifest:
    get:
      tags:
      - Agent Inputs
      operationId: getAgentInputManifest
      parameters:
      - $ref: '#/components/parameters/inputId'
      responses:
        '200':
          description: Checksum-bound manifest
      summary: get Agent Input Manifest
      description: This operation implements the documented "get Agent Input Manifest" API capability. Use it when a client
        needs to ingest or inspect a large immutable agent input and its permanent constraint ledger. Inputs use the documented
        path, query and header parameters; success returns checksum-bound manifest. Authentication, tenant authorization,
        resource ceilings and documented failure responses are enforced before a result is accepted.
  /v1/agent-inputs/{inputId}/requirements:
    get:
      tags:
      - Agent Inputs
      operationId: getAgentInputRequirements
      parameters:
      - $ref: '#/components/parameters/inputId'
      responses:
        '200':
          description: Constraint ledger
      summary: get Agent Input Requirements
      description: This operation implements the documented "get Agent Input Requirements" API capability. Use it when a client
        needs to ingest or inspect a large immutable agent input and its permanent constraint ledger. Inputs use the documented
        path, query and header parameters; success returns constraint ledger. Authentication, tenant authorization, resource
        ceilings and documented failure responses are enforced before a result is accepted.
  /v1/qualification-workloads:
    post:
      tags:
      - CPU Qualification
      operationId: createQualificationWorkload
      summary: Partition one frozen input into deterministic multinode CPU work
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QualificationWorkloadCreate'
      responses:
        '202':
          description: Durable qualification workload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QualificationWorkload'
        '409':
          description: Input is not frozen or idempotency conflicts
      description: This operation implements the documented "Partition one frozen input into deterministic multinode CPU work"
        API capability. Use it when a client needs to ingest or inspect a large immutable agent input and its permanent constraint
        ledger. The request body uses application/json and the schema shown below; success returns durable qualification workload.
        Authentication, tenant authorization, resource ceilings and documented failure responses are enforced before a result
        is accepted.
  /v1/qualification-workloads/{workloadId}:
    get:
      tags:
      - CPU Qualification
      operationId: getQualificationWorkload
      summary: Get exact partition progress and deterministic result root
      parameters:
      - $ref: '#/components/parameters/workloadId'
      responses:
        '200':
          description: Qualification workload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QualificationWorkload'
        '404':
          description: Not found within the authenticated tenant
      description: This operation implements the documented "Get exact partition progress and deterministic result root" API
        capability. Use it when an operator needs deterministic distributed-work evidence or the live resource envelope before
        enabling an optimized path. Inputs use the documented path, query and header parameters; success returns qualification
        workload. Authentication, tenant authorization, resource ceilings and documented failure responses are enforced before
        a result is accepted.
  /v1/qualification-workloads/{workloadId}/checkpoints:
    get:
      tags:
      - CPU Qualification
      operationId: getQualificationCheckpoints
      summary: List immutable per-partition checkpoint evidence
      parameters:
      - $ref: '#/components/parameters/workloadId'
      responses:
        '200':
          description: Ordered checkpoint evidence
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QualificationCheckpoint'
      description: This operation implements the documented "List immutable per-partition checkpoint evidence" API capability.
        Use it when an operator needs deterministic distributed-work evidence or the live resource envelope before enabling
        an optimized path. Inputs use the documented path, query and header parameters; success returns ordered checkpoint
        evidence. Authentication, tenant authorization, resource ceilings and documented failure responses are enforced before
        a result is accepted.
  /v1/qualification-workloads/{workloadId}/cancel:
    post:
      tags:
      - CPU Qualification
      operationId: cancelQualificationWorkload
      summary: Cancel all uncommitted partitions without deleting evidence
      parameters:
      - $ref: '#/components/parameters/workloadId'
      responses:
        '200':
          description: Cancelled workload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QualificationWorkload'
        '409':
          description: Workload is already terminal
      description: This operation implements the documented "Cancel all uncommitted partitions without deleting evidence"
        API capability. Use it when an operator needs deterministic distributed-work evidence or the live resource envelope
        before enabling an optimized path. Inputs use the documented path, query and header parameters; success returns cancelled
        workload. Authentication, tenant authorization, resource ceilings and documented failure responses are enforced before
        a result is accepted.
  /v1/agent-executions:
    post:
      tags:
      - Managed Agents
      operationId: executeManagedAgent
      summary: Run a model proposal loop and issue an answer certificate only when every RDF claim is entailed
      responses:
        '200':
          description: Certified agent answer
        '422':
          description: No answer returned because certification failed
      description: This operation implements the documented "Run a model proposal loop and issue an answer certificate only
        when every RDF claim is entailed" API capability. Use it when an API client needs this capability through the supported
        contract instead of coupling to an internal service. The operation uses the documented request contract; success returns
        certified agent answer. Authentication, tenant authorization, resource ceilings and documented failure responses are
        enforced before a result is accepted.
  /v1/tool-providers:
    post:
      tags:
      - Tenant Tools
      operationId: registerToolProvider
      summary: Register an immutable pending tenant MCP provider
      responses:
        '201':
          description: Pending provider receipt
      description: This operation implements the documented "Register an immutable pending tenant MCP provider" API capability.
        Use it when an agent workflow needs a qualified external tool under tenant policy, bounded transport and audit controls.
        The operation uses the documented request contract; success returns pending provider receipt. Authentication, tenant
        authorization, resource ceilings and documented failure responses are enforced before a result is accepted.
  /v1/tool-providers/{providerId}/versions/{version}/qualify:
    post:
      tags:
      - Tenant Tools
      operationId: qualifyToolProvider
      summary: Perform live MCP initialization and catalog qualification
      parameters:
      - $ref: '#/components/parameters/providerId'
      - in: path
        name: version
        required: true
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: Qualified checksum-bound tool catalog
      description: This operation implements the documented "Perform live MCP initialization and catalog qualification" API
        capability. Use it when an agent workflow needs a qualified external tool under tenant policy, bounded transport and
        audit controls. Inputs use the documented path, query and header parameters; success returns qualified checksum-bound
        tool catalog. Authentication, tenant authorization, resource ceilings and documented failure responses are enforced
        before a result is accepted.
  /v1/tool-approvals:
    post:
      tags:
      - Tenant Tools
      operationId: recordToolApproval
      summary: Record an immutable scoped approval or denial
      responses:
        '201':
          description: Approval receipt
      description: This operation implements the documented "Record an immutable scoped approval or denial" API capability.
        Use it when an agent workflow needs a qualified external tool under tenant policy, bounded transport and audit controls.
        The operation uses the documented request contract; success returns approval receipt. Authentication, tenant authorization,
        resource ceilings and documented failure responses are enforced before a result is accepted.
  /v1/tool-calls:
    post:
      tags:
      - Tenant Tools
      operationId: invokeQualifiedTool
      summary: Invoke one catalog-qualified tool with bounded transport
      responses:
        '200':
          description: UNTRUSTED_EXTERNAL_TOOL result
        '409':
          description: Approval required
      description: This operation implements the documented "Invoke one catalog-qualified tool with bounded transport" API
        capability. Use it when an agent workflow needs a qualified external tool under tenant policy, bounded transport and
        audit controls. The operation uses the documented request contract; success returns untrusted_external_tool result.
        Authentication, tenant authorization, resource ceilings and documented failure responses are enforced before a result
        is accepted.
  /v1/memories:
    post:
      tags:
      - Agent Memory
      operationId: proposeMemory
      x-mcp-tool: ngkg_memory_propose
      summary: Propose immutable working
      episodic: null
      semantic: null
      procedural or evidence memory: null
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryProposal'
      responses:
        '201':
          $ref: '#/components/responses/MemoryView'
        '422':
          description: Poisoning or evidence rejected
      description: This operation implements the documented "Propose immutable working" API capability. Use it when an API
        client needs this capability through the supported contract instead of coupling to an internal service. The request
        body uses application/json and the schema shown below; success returns the MemoryView response schema. Authentication,
        tenant authorization, resource ceilings and documented failure responses are enforced before a result is accepted.
  /v1/memories/search:
    post:
      tags:
      - Agent Memory
      operationId: searchMemories
      x-mcp-tool: ngkg_memory_search
      summary: Search only authorized
      current and unexpired memory: null
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemorySearch'
      responses:
        '200':
          description: Memory array
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MemoryView'
      description: This operation implements the documented "Search only authorized" API capability. Use it when an API client
        needs this capability through the supported contract instead of coupling to an internal service. The request body
        uses application/json and the schema shown below; success returns memory array. Authentication, tenant authorization,
        resource ceilings and documented failure responses are enforced before a result is accepted.
  /v1/memories/{memoryId}:
    get:
      tags:
      - Agent Memory
      operationId: getMemory
      summary: Read an exact authorized memory version
      parameters:
      - $ref: '#/components/parameters/memoryId'
      responses:
        '200':
          $ref: '#/components/responses/MemoryView'
      description: This operation implements the documented "Read an exact authorized memory version" API capability. Use
        it when an agent workflow needs durable, evidence-bound memory without allowing a model to write authoritative facts
        directly. Inputs use the documented path, query and header parameters; success returns the MemoryView response schema.
        Authentication, tenant authorization, resource ceilings and documented failure responses are enforced before a result
        is accepted.
  /v1/memories/{memoryId}/explain:
    get:
      tags:
      - Agent Memory
      operationId: explainMemory
      x-mcp-tool: ngkg_memory_explain
      summary: Explain provenance
      transitions: null
      edges and inclusion/exclusion policy: null
      parameters:
      - $ref: '#/components/parameters/memoryId'
      responses:
        '200':
          description: Memory explanation
      description: This operation implements the documented "Explain provenance" API capability. Use it when an agent workflow
        needs durable, evidence-bound memory without allowing a model to write authoritative facts directly. Inputs use the
        documented path, query and header parameters; success returns memory explanation. Authentication, tenant authorization,
        resource ceilings and documented failure responses are enforced before a result is accepted.
  /v1/memories/{memoryId}/validate:
    post:
      tags:
      - Agent Memory
      operationId: validateMemory
      x-mcp-tool: ngkg_memory_validate
      summary: Structurally validate memory and re-entail semantic statements through NGKG
      parameters:
      - $ref: '#/components/parameters/memoryId'
      responses:
        '200':
          description: Validation and proof evidence
        '422':
          description: Unknown or evidence mismatch
      description: This operation implements the documented "Structurally validate memory and re-entail semantic statements
        through NGKG" API capability. Use it when an agent workflow needs durable, evidence-bound memory without allowing
        a model to write authoritative facts directly. Inputs use the documented path, query and header parameters; success
        returns validation and proof evidence. Authentication, tenant authorization, resource ceilings and documented failure
        responses are enforced before a result is accepted.
  /v1/memories/{memoryId}/approve:
    post:
      tags:
      - Agent Memory
      operationId: approveMemory
      x-mcp-tool: ngkg_memory_approve
      summary: Approve an entailed semantic memory for publication activation
      parameters:
      - $ref: '#/components/parameters/memoryId'
      requestBody:
        $ref: '#/components/requestBodies/Reason'
      responses:
        '200':
          $ref: '#/components/responses/MemoryView'
      description: This operation implements the documented "Approve an entailed semantic memory for publication activation"
        API capability. Use it when an agent workflow needs durable, evidence-bound memory without allowing a model to write
        authoritative facts directly. The request body uses the documented media type and the schema shown below; success
        returns the MemoryView response schema. Authentication, tenant authorization, resource ceilings and documented failure
        responses are enforced before a result is accepted.
  /v1/memories/{memoryId}/publish:
    post:
      tags:
      - Agent Memory
      operationId: publishMemory
      x-mcp-tool: ngkg_memory_publish
      summary: Activate semantic memory only after re-entailment in an atomically published NGKG snapshot
      parameters:
      - $ref: '#/components/parameters/memoryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryPublication'
      responses:
        '200':
          description: Publication receipt
        '422':
          description: Not entailed; no activation
      description: This operation implements the documented "Activate semantic memory only after re-entailment in an atomically
        published NGKG snapshot" API capability. Use it when an agent workflow needs durable, evidence-bound memory without
        allowing a model to write authoritative facts directly. The request body uses application/json and the schema shown
        below; success returns publication receipt. Authentication, tenant authorization, resource ceilings and documented
        failure responses are enforced before a result is accepted.
  /v1/memories/{memoryId}/supersede:
    post:
      tags:
      - Agent Memory
      operationId: supersedeMemory
      x-mcp-tool: ngkg_memory_supersede
      summary: Exclude an older memory using an immutable supersession edge
      parameters:
      - $ref: '#/components/parameters/memoryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemorySupersede'
      responses:
        '200':
          $ref: '#/components/responses/MemoryView'
      description: This operation implements the documented "Exclude an older memory using an immutable supersession edge"
        API capability. Use it when an agent workflow needs durable, evidence-bound memory without allowing a model to write
        authoritative facts directly. The request body uses application/json and the schema shown below; success returns the
        MemoryView response schema. Authentication, tenant authorization, resource ceilings and documented failure responses
        are enforced before a result is accepted.
  /v1/memories/{memoryId}/revoke:
    post:
      tags:
      - Agent Memory
      operationId: revokeMemory
      x-mcp-tool: ngkg_memory_revoke
      summary: Revoke and exclude a memory without deleting history
      parameters:
      - $ref: '#/components/parameters/memoryId'
      requestBody:
        $ref: '#/components/requestBodies/Reason'
      responses:
        '200':
          $ref: '#/components/responses/MemoryView'
      description: This operation implements the documented "Revoke and exclude a memory without deleting history" API capability.
        Use it when an agent workflow needs durable, evidence-bound memory without allowing a model to write authoritative
        facts directly. The request body uses the documented media type and the schema shown below; success returns the MemoryView
        response schema. Authentication, tenant authorization, resource ceilings and documented failure responses are enforced
        before a result is accepted.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    datasetId:
      in: path
      name: datasetId
      required: true
      schema:
        type: string
        format: uuid
    queryExecutionId:
      in: path
      name: queryExecutionId
      required: true
      schema:
        type: string
        format: uuid
    inputId:
      in: path
      name: inputId
      required: true
      schema:
        type: string
        format: uuid
    providerId:
      in: path
      name: providerId
      required: true
      schema:
        type: string
        format: uuid
    memoryId:
      in: path
      name: memoryId
      required: true
      schema:
        type: string
        format: uuid
    workloadId:
      in: path
      name: workloadId
      required: true
      schema:
        type: string
        format: uuid
  requestBodies:
    Reason:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MemoryReason'
  responses:
    Unauthorized:
      description: Missing or invalid bearer identity
    DependencyFailure:
      description: Required dependency failed closed
    SemanticEnvelope:
      description: Complete checksum-bound reasoned context envelope
    MemoryView:
      description: Exact authorized memory
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MemoryView'
  schemas:
    QueryRequest:
      type: object
      additionalProperties: false
      required:
      - query
      - hydrate
      properties:
        query:
          type: string
          minLength: 1
        snapshotId:
          type:
          - string
          - 'null'
          format: uuid
        hydrate:
          type: boolean
        defaultGraphUris:
          type: array
          items:
            type: string
            format: uri
        namedGraphUris:
          type: array
          items:
            type: string
            format: uri
    MemoryClass:
      enum:
      - WORKING
      - EPISODIC
      - SEMANTIC
      - PROCEDURAL
      - EVIDENCE
    MemoryState:
      enum:
      - PROPOSED
      - VALIDATING
      - VALIDATED
      - ENTAILED
      - CONTRADICTED
      - UNKNOWN
      - APPROVAL_REQUIRED
      - APPROVED
      - PUBLISHED
      - SUPERSEDED
      - REVOKED
      - REJECTED
      - EXPIRED
    Hash:
      type: string
      pattern: ^[0-9a-f]{64}$
    MemoryProposal:
      type: object
      additionalProperties: false
      required:
      - memoryClass
      - audience
      - contentType
      - content
      - provenance
      - retentionDays
      - legalHold
      - idempotencyKey
      properties:
        memoryClass:
          $ref: '#/components/schemas/MemoryClass'
        audience:
          enum:
          - OWNER
          - TENANT
        contentType:
          enum:
          - text/plain
          - application/json
          - application/n-triples
        content:
          type: string
          minLength: 1
          maxLength: 1048576
        sourceExecutionId:
          type:
          - string
          - 'null'
          format: uuid
        datasetId:
          type:
          - string
          - 'null'
          format: uuid
        snapshotId:
          type:
          - string
          - 'null'
          format: uuid
        authorizedGraphSetSha256:
          oneOf:
          - $ref: '#/components/schemas/Hash'
          - type: 'null'
        semanticResultSha256:
          oneOf:
          - $ref: '#/components/schemas/Hash'
