vllm:
  runtimeClassName: ''
  nodeProvisioning: {provider: eks, poolName: ngkg-gpu}
  scheduling:
    nodeSelector:
      ngkg.io/accelerator: nvidia-gpu
      kubernetes.io/arch: amd64
    tolerations:
      - {key: ngkg.io/gpu, operator: Equal, value: 'true', effect: NoSchedule}
    topologyKey: topology.kubernetes.io/zone
    capacityTypeValues: [on-demand, spot]
  serviceAccountAnnotations: {}
