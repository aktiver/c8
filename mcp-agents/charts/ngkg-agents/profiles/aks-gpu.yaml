vllm:
  runtimeClassName: ''
  nodeProvisioning: {provider: aks, poolName: ngkggpu}
  scheduling:
    nodeSelector:
      ngkg.io/accelerator: nvidia-gpu
      kubernetes.io/arch: amd64
    tolerations:
      - {key: ngkg.io/gpu, operator: Equal, value: 'true', effect: NoSchedule}
    topologyKey: topology.kubernetes.io/zone
    capacityTypeValues: []
  serviceAccountAnnotations: {}
  podLabels:
    azure.workload.identity/use: 'true'
