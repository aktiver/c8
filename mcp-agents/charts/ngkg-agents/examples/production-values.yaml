image:
  repository: registry.example.com/ngkg/mcp-gateway
  digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa

query:
  baseUrl: https://ngkg-query.ngkg.svc.cluster.local:32010/
  toolsEnabled: true

auth:
  mode: delegation
  delegation:
    issuer: https://identity.example.com/
    audience: https://ngkg.example.com/
    jwksUrl: https://identity.example.com/.well-known/jwks.json
    resource: https://mcp.example.com/mcp
    authorizationServers: [https://identity.example.com/]
    allowedAlgorithms: [RS256]
    egressIpBlocks: [203.0.113.10/32]
    exchange:
      enabled: true
      endpoint: https://identity.example.com/oauth2/token
      scopes: [queries:execute, agent-inputs:read, agent-inputs:write]
      clientAuthentication: workload-identity

database:
  runtimeSecret: ngkg-agent-database-runtime
  runtimeSecretKey: database-url
  migrationSecret: ngkg-agent-database-migration
  migrationSecretKey: database-url
  runtimeRole: ngkg_agent_runtime
  podSelector:
    app.kubernetes.io/name: postgresql

audit:
  serviceBuildSha256: cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc

mcp:
  allowedHosts:
    - mcp.example.com
  allowedOrigins:
    - https://chatgpt.com
    - https://claude.ai

inputStorage:
  provider: s3
  s3:
    bucket: ngkg-agent-inputs-example
    region: us-east-1
  egressIpBlocks: [198.51.100.0/24]
  serviceAccountAnnotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/ngkg-agent-inputs

networkPolicy:
  ingressNamespaceSelector:
    matchLabels:
      ngkg.io/agent-client: 'true'
  ingressPodSelector: {}
