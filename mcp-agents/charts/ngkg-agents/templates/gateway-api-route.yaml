{{- if .Values.gatewayApi.enabled }}
{{- if not .Values.gatewayApi.parentRefs }}{{ fail "gatewayApi.parentRefs must identify an installed Gateway when gatewayApi.enabled=true" }}{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ngkg-agents
spec:
  parentRefs: {{- toYaml .Values.gatewayApi.parentRefs | nindent 4 }}
  {{- if .Values.gatewayApi.hostnames }}
  hostnames: {{- toYaml .Values.gatewayApi.hostnames | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        - path: {type: PathPrefix, value: /v1/agent-executions}
      backendRefs: [{name: ngkg-orchestrator, port: {{ .Values.service.port }}}]
    - matches:
        - path: {type: PathPrefix, value: /v1/memories}
      backendRefs: [{name: ngkg-memory, port: {{ .Values.service.port }}}]
    - matches:
        - path: {type: PathPrefix, value: /v1/tool-providers}
        - path: {type: PathPrefix, value: /v1/tool-approvals}
        - path: {type: PathPrefix, value: /v1/tool-calls}
      backendRefs: [{name: ngkg-tool-broker, port: {{ .Values.service.port }}}]
    - backendRefs: [{name: ngkg-mcp-gateway, port: {{ .Values.service.port }}}]
{{- end }}
