{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: ngkg-mcp-gateway-default-deny}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ngkg-agents
      app.kubernetes.io/component: mcp-gateway
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: ngkg-mcp-gateway-allow}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ngkg-agents
      app.kubernetes.io/component: mcp-gateway
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
{{ toYaml .Values.networkPolicy.ingressNamespaceSelector | nindent 12 }}
          podSelector:
{{ toYaml .Values.networkPolicy.ingressPodSelector | nindent 12 }}
      ports: [{protocol: TCP, port: {{ .Values.service.port }}}]
  egress:
    - to:
        - namespaceSelector:
{{ toYaml .Values.networkPolicy.dnsNamespaceSelector | nindent 12 }}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ngkg
              app.kubernetes.io/component: query-shard
      ports: [{protocol: TCP, port: 32010}]
    - to:
        - podSelector:
            matchLabels:
{{ toYaml .Values.database.podSelector | nindent 14 }}
        {{- range .Values.database.ipBlocks }}
        - ipBlock: {cidr: {{ . | quote }}}
        {{- end }}
      ports: [{protocol: TCP, port: {{ .Values.database.port }}}]
    {{- if eq .Values.auth.mode "delegation" }}
    - to:
        {{- range .Values.auth.delegation.egressIpBlocks }}
        - ipBlock: {cidr: {{ . | quote }}}
        {{- end }}
      ports: [{protocol: TCP, port: 443}]
    {{- end }}
    {{- if .Values.inputStorage.egressIpBlocks }}
    - to:
        {{- range .Values.inputStorage.egressIpBlocks }}
        - ipBlock: {cidr: {{ . | quote }}}
        {{- end }}
      ports: [{protocol: TCP, port: 443}]
    {{- end }}
    {{- if .Values.vllm.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ngkg-agents
              app.kubernetes.io/component: inference-gateway
      ports: [{protocol: TCP, port: {{ .Values.inferenceGateway.port }}}]
    {{- end }}
    {{- if .Values.managedAgents.providerEgressIpBlocks }}
    - to:
        {{- range .Values.managedAgents.providerEgressIpBlocks }}
        - ipBlock: {cidr: {{ . | quote }}}
        {{- end }}
      ports: [{protocol: TCP, port: 443}]
    {{- end }}
    {{- if .Values.toolBroker.externalEgressIpBlocks }}
    - to:
        {{- range .Values.toolBroker.externalEgressIpBlocks }}
        - ipBlock: {cidr: {{ . | quote }}}
        {{- end }}
      ports: [{protocol: TCP, port: 443}]
    {{- end }}
{{- end }}
