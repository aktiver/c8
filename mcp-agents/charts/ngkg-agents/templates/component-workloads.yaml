{{- $root := . -}}
{{- range $name, $component := .Values.components }}
{{- if $component.enabled }}
{{- $role := kebabcase $name }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ngkg-{{ $role }}
  labels: {app.kubernetes.io/name: ngkg-agents, app.kubernetes.io/component: {{ $role }}}
  annotations: {{- toYaml $root.Values.inputStorage.serviceAccountAnnotations | nindent 4 }}
imagePullSecrets: {{ toJson $root.Values.imagePullSecrets }}
automountServiceAccountToken: true
---
apiVersion: v1
kind: Service
metadata:
  name: ngkg-{{ $role }}
  labels: {app.kubernetes.io/name: ngkg-agents, app.kubernetes.io/component: {{ $role }}}
spec:
  selector: {app.kubernetes.io/name: ngkg-agents, app.kubernetes.io/component: {{ $role }}}
  ports: [{name: http, port: {{ $root.Values.service.port }}, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ngkg-{{ $role }}
  labels: {app.kubernetes.io/name: ngkg-agents, app.kubernetes.io/component: {{ $role }}}
spec:
  replicas: {{ $component.replicaCount }}
  revisionHistoryLimit: 3
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 1, maxSurge: 1}}
  selector:
    matchLabels: {app.kubernetes.io/name: ngkg-agents, app.kubernetes.io/component: {{ $role }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: ngkg-agents, app.kubernetes.io/component: {{ $role }}}
    spec:
      serviceAccountName: ngkg-{{ $role }}
      imagePullSecrets: {{ toJson $root.Values.imagePullSecrets }}
      terminationGracePeriodSeconds: 60
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: {{ $root.Values.scheduling.topologyKey | quote }}
          whenUnsatisfiable: DoNotSchedule
          labelSelector: {matchLabels: {app.kubernetes.io/name: ngkg-agents, app.kubernetes.io/component: {{ $role }}}}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector: {matchLabels: {app.kubernetes.io/name: ngkg-agents, app.kubernetes.io/component: {{ $role }}}}
      nodeSelector: {{- toYaml $component.scheduling.nodeSelector | nindent 8 }}
      tolerations: {{- toYaml $component.scheduling.tolerations | nindent 8 }}
      containers:
        - name: {{ $role }}
          image: '{{ required "image.repository is required" $root.Values.image.repository }}@{{ required "image.digest is required" $root.Values.image.digest }}'
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          ports: [{name: http, containerPort: {{ $root.Values.service.port }}}]
          env:
            - {name: NGKG_COMPONENT_ROLE, value: {{ $role | quote }}}
            - {name: NGKG_MCP_BIND, value: '0.0.0.0:{{ $root.Values.service.port }}'}
            - {name: NGKG_QUERY_BASE_URL, value: {{ $root.Values.query.baseUrl | quote }}}
            - {name: NGKG_MCP_QUERY_TOOLS_ENABLED, value: {{ $root.Values.query.toolsEnabled | quote }}}
            - {name: NGKG_ALLOW_HTTP_LOOPBACK, value: {{ $root.Values.query.allowHttpLoopback | quote }}}
            - {name: NGKG_AUTH_MODE, value: {{ $root.Values.auth.mode | quote }}}
            {{- if eq $root.Values.auth.mode "opaque" }}
            - {name: NGKG_AUTH_TOKEN_FILE, value: /var/run/ngkg/auth/tokens.json}
            - {name: NGKG_AUTH_TOKEN_FILE_SHA256, value: {{ required "auth.opaque.tokenFileSha256 is required" $root.Values.auth.opaque.tokenFileSha256 | quote }}}
            {{- else }}
            - {name: NGKG_AUTH_ISSUER, value: {{ required "auth.delegation.issuer is required" $root.Values.auth.delegation.issuer | quote }}}
            - {name: NGKG_AUTH_AUDIENCE, value: {{ required "auth.delegation.audience is required" $root.Values.auth.delegation.audience | quote }}}
            - {name: NGKG_AUTH_JWKS_URL, value: {{ required "auth.delegation.jwksUrl is required" $root.Values.auth.delegation.jwksUrl | quote }}}
            - {name: NGKG_AUTH_RESOURCE, value: {{ required "auth.delegation.resource is required" $root.Values.auth.delegation.resource | quote }}}
            - {name: NGKG_AUTH_AUTHORIZATION_SERVERS, value: {{ join "," $root.Values.auth.delegation.authorizationServers | quote }}}
            - {name: NGKG_AUTH_ALLOWED_ALGORITHMS, value: {{ join "," $root.Values.auth.delegation.allowedAlgorithms | quote }}}
            - {name: NGKG_AUTH_REQUIRED_TYP, value: {{ $root.Values.auth.delegation.requiredTyp | quote }}}
            - {name: NGKG_AUTH_MAX_TOKEN_LIFETIME_SECONDS, value: {{ $root.Values.auth.delegation.maximumTokenLifetimeSeconds | quote }}}
            - {name: NGKG_AUTH_CLOCK_SKEW_SECONDS, value: {{ $root.Values.auth.delegation.clockSkewSeconds | quote }}}
            - {name: NGKG_AUTH_JWKS_CACHE_TTL_SECONDS, value: {{ $root.Values.auth.delegation.jwksCacheTtlSeconds | quote }}}
            - {name: NGKG_AUTH_JWKS_LAST_KNOWN_GOOD_SECONDS, value: {{ $root.Values.auth.delegation.lastKnownGoodSeconds | quote }}}
            - {name: NGKG_AUTH_CONNECT_TIMEOUT_MS, value: {{ $root.Values.auth.delegation.connectTimeoutMilliseconds | quote }}}
            - {name: NGKG_AUTH_REQUEST_TIMEOUT_MS, value: {{ $root.Values.auth.delegation.requestTimeoutMilliseconds | quote }}}
            - {name: NGKG_AUTH_ALLOW_HTTPS_LOOPBACK, value: {{ $root.Values.auth.delegation.allowHttpsLoopback | quote }}}
            - {name: NGKG_AUTH_EXCHANGE_ENABLED, value: 'false'}
            - {name: NGKG_AUTH_EXCHANGE_SCOPES, value: {{ join "," $root.Values.auth.delegation.exchange.scopes | quote }}}
            {{- end }}
            - name: NGKG_AGENT_DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ $root.Values.database.runtimeSecret | quote }}, key: {{ $root.Values.database.runtimeSecretKey | quote }}}}
            - {name: NGKG_AGENT_DATABASE_MAX_CONNECTIONS, value: {{ $root.Values.database.maximumConnections | quote }}}
            - {name: NGKG_AGENT_DATABASE_ACQUIRE_TIMEOUT_MS, value: {{ $root.Values.database.acquireTimeoutMilliseconds | quote }}}
            - {name: NGKG_AGENT_DATABASE_ALLOW_INSECURE_LOOPBACK, value: {{ $root.Values.database.allowInsecureLoopback | quote }}}
            - {name: NGKG_AGENT_SERVICE_BUILD_SHA256, value: {{ required "audit.serviceBuildSha256 is required" $root.Values.audit.serviceBuildSha256 | quote }}}
            - {name: NGKG_MCP_ALLOWED_HOSTS, value: {{ join "," $root.Values.mcp.allowedHosts | quote }}}
            - {name: NGKG_MCP_ALLOWED_ORIGINS, value: {{ join "," $root.Values.mcp.allowedOrigins | quote }}}
            - {name: NGKG_MCP_MAX_REQUEST_BYTES, value: {{ $root.Values.mcp.maximumRequestBytes | quote }}}
            - {name: NGKG_MCP_MAX_QUERY_BYTES, value: {{ $root.Values.mcp.maximumQueryBytes | quote }}}
            - {name: NGKG_MCP_MAX_UPSTREAM_RESPONSE_BYTES, value: {{ $root.Values.mcp.maximumUpstreamResponseBytes | quote }}}
            - {name: NGKG_MCP_MAX_IN_FLIGHT, value: {{ $root.Values.mcp.maximumInFlight | quote }}}
            - {name: NGKG_MCP_ADMISSION_TIMEOUT_MS, value: {{ $root.Values.mcp.admissionTimeoutMilliseconds | quote }}}
            - {name: NGKG_MCP_CONNECT_TIMEOUT_MS, value: {{ $root.Values.mcp.connectTimeoutMilliseconds | quote }}}
            - {name: NGKG_MCP_REQUEST_TIMEOUT_MS, value: {{ $root.Values.mcp.requestTimeoutMilliseconds | quote }}}
            - {name: NGKG_MCP_MAX_RESULT_ROWS, value: {{ $root.Values.mcp.maximumResultRows | quote }}}
            - {name: NGKG_MCP_MAX_CONTEXT_TRIPLES, value: {{ $root.Values.mcp.maximumContextTriples | quote }}}
            - {name: NGKG_MCP_MAX_CONTEXT_BYTES, value: {{ $root.Values.mcp.maximumContextBytes | quote }}}
            - {name: NGKG_INPUT_MAX_PART_BYTES, value: {{ $root.Values.inputApi.maximumPartBytes | quote }}}
            - {name: NGKG_INPUT_MAX_PARTS, value: {{ $root.Values.inputApi.maximumParts | quote }}}
            - {name: NGKG_INPUT_MAX_BYTES, value: {{ $root.Values.inputApi.maximumBytes | quote }}}
            - {name: NGKG_MANAGED_AGENTS_ENABLED, value: {{ and (eq $role "orchestrator") $root.Values.managedAgents.enabled | quote }}}
            - {name: NGKG_TOOL_BROKER_ENABLED, value: {{ and (eq $role "tool-broker") $root.Values.toolBroker.enabled | quote }}}
            - {name: NGKG_MEMORY_ENABLED, value: {{ and (eq $role "memory") $root.Values.memory.enabled | quote }}}
            - {name: NGKG_AGENT_MAX_SOURCE_BYTES, value: {{ $root.Values.managedAgents.maximumSourceBytes | quote }}}
            - {name: NGKG_AGENT_MAX_REQUIREMENTS, value: {{ $root.Values.managedAgents.maximumRequirements | quote }}}
            - {name: NGKG_AGENT_MAX_MODEL_CONTEXT_BYTES, value: {{ $root.Values.managedAgents.maximumModelContextBytes | quote }}}
            - {name: NGKG_AGENT_MAX_CLAIMS, value: {{ $root.Values.managedAgents.maximumClaims | quote }}}
            - {name: NGKG_AGENT_MAX_OUTPUT_TOKENS, value: {{ $root.Values.managedAgents.maximumOutputTokens | quote }}}
            - {name: NGKG_TOOL_PROTOCOL_VERSIONS, value: {{ join "," $root.Values.toolBroker.protocolVersions | quote }}}
            - {name: NGKG_TOOL_MAX_TOOLS, value: {{ $root.Values.toolBroker.maximumTools | quote }}}
            - {name: NGKG_TOOL_MAX_SCHEMA_DEPTH, value: {{ $root.Values.toolBroker.maximumSchemaDepth | quote }}}
            - {name: NGKG_TOOL_MAX_CATALOG_BYTES, value: {{ $root.Values.toolBroker.maximumCatalogBytes | quote }}}
            - {name: NGKG_TOOL_MAX_REQUEST_BYTES, value: {{ $root.Values.toolBroker.maximumRequestBytes | quote }}}
            - {name: NGKG_TOOL_MAX_RESPONSE_BYTES, value: {{ $root.Values.toolBroker.maximumResponseBytes | quote }}}
            - {name: NGKG_TOOL_MAX_CATALOG_PAGES, value: {{ $root.Values.toolBroker.maximumCatalogPages | quote }}}
            - {name: NGKG_TOOL_MAX_IN_FLIGHT, value: {{ $root.Values.toolBroker.maximumInFlight | quote }}}
            - {name: NGKG_TOOL_CONNECT_TIMEOUT_MS, value: {{ $root.Values.toolBroker.connectTimeoutMilliseconds | quote }}}
            - {name: NGKG_TOOL_REQUEST_TIMEOUT_MS, value: {{ $root.Values.toolBroker.requestTimeoutMilliseconds | quote }}}
            - {name: NGKG_TOOL_ALLOW_CLUSTER_PRIVATE_ENDPOINTS, value: {{ $root.Values.toolBroker.allowClusterPrivateEndpoints | quote }}}
            {{- if and (eq $role "tool-broker") $root.Values.toolBroker.enabled $root.Values.toolBroker.credentialsSecret }}
            - {name: NGKG_TOOL_CREDENTIALS_FILE, value: /var/run/ngkg/tool-credentials/credentials.json}
            - {name: NGKG_TOOL_CREDENTIALS_FILE_SHA256, value: {{ required "toolBroker.credentialsFileSha256 is required" $root.Values.toolBroker.credentialsFileSha256 | quote }}}
            {{- end }}
            - {name: NGKG_MEMORY_MAX_CONTENT_BYTES, value: {{ $root.Values.memory.maximumContentBytes | quote }}}
            - {name: NGKG_MEMORY_MAX_SEARCH_RESULTS, value: {{ $root.Values.memory.maximumSearchResults | quote }}}
            - {name: NGKG_MEMORY_MAX_STATEMENTS, value: {{ $root.Values.memory.maximumStatements | quote }}}
            - {name: NGKG_MEMORY_MAX_WORKING_TTL_SECONDS, value: {{ $root.Values.memory.maximumWorkingTtlSeconds | quote }}}
            - {name: NGKG_MEMORY_MAX_RETENTION_DAYS, value: {{ $root.Values.memory.maximumRetentionDays | quote }}}
            {{- if and (eq $role "orchestrator") $root.Values.managedAgents.enabled }}
            - {name: NGKG_MODEL_PROVIDERS_FILE, value: /var/run/ngkg/model-providers/providers.json}
            - {name: NGKG_MODEL_PROVIDERS_FILE_SHA256, value: {{ required "managedAgents.providerFileSha256 is required" $root.Values.managedAgents.providerFileSha256 | quote }}}
            {{- end }}
            - {name: NGKG_INPUT_OBJECT_STORE, value: {{ $root.Values.inputStorage.provider | quote }}}
            {{- if eq $root.Values.inputStorage.provider "s3" }}
            - {name: NGKG_INPUT_S3_BUCKET, value: {{ required "inputStorage.s3.bucket is required" $root.Values.inputStorage.s3.bucket | quote }}}
            - {name: AWS_DEFAULT_REGION, value: {{ required "inputStorage.s3.region is required" $root.Values.inputStorage.s3.region | quote }}}
            {{- else if eq $root.Values.inputStorage.provider "azure" }}
            - {name: NGKG_INPUT_AZURE_CONTAINER, value: {{ required "inputStorage.azure.container is required" $root.Values.inputStorage.azure.container | quote }}}
            - {name: AZURE_STORAGE_ACCOUNT_NAME, value: {{ required "inputStorage.azure.account is required" $root.Values.inputStorage.azure.account | quote }}}
            {{- else if eq $root.Values.inputStorage.provider "gcs" }}
            - {name: NGKG_INPUT_GCS_BUCKET, value: {{ required "inputStorage.gcs.bucket is required" $root.Values.inputStorage.gcs.bucket | quote }}}
            {{- else }}
            - {name: NGKG_INPUT_LOCAL_ROOT, value: {{ $root.Values.inputStorage.localTest.root | quote }}}
            {{- end }}
            - {name: OMP_NUM_THREADS, value: '1'}
            - {name: OPENBLAS_NUM_THREADS, value: '1'}
            - {name: MKL_NUM_THREADS, value: '1'}
          resources: {{- toYaml $component.resources | nindent 12 }}
          startupProbe: {httpGet: {path: /health/ready, port: http}, periodSeconds: 5, failureThreshold: 60}
          readinessProbe: {httpGet: {path: /health/ready, port: http}, periodSeconds: 5, timeoutSeconds: 2}
          livenessProbe: {httpGet: {path: /health/live, port: http}, periodSeconds: 15, timeoutSeconds: 2}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            {{- if eq $root.Values.auth.mode "opaque" }}
            - {name: auth, mountPath: /var/run/ngkg/auth, readOnly: true}
            {{- end }}
            {{- if and (eq $role "orchestrator") $root.Values.managedAgents.enabled }}
            - {name: model-providers, mountPath: /var/run/ngkg/model-providers, readOnly: true}
            {{- if $root.Values.managedAgents.credentialSecret }}
            - {name: model-credentials, mountPath: /var/run/ngkg/model-credentials, readOnly: true}
            {{- end }}
            {{- end }}
            {{- if and (eq $role "tool-broker") $root.Values.toolBroker.enabled $root.Values.toolBroker.credentialsSecret }}
            - {name: tool-credentials, mountPath: /var/run/ngkg/tool-credentials, readOnly: true}
            {{- end }}
            - {name: tmp, mountPath: /tmp}
      volumes:
        {{- if eq $root.Values.auth.mode "opaque" }}
        - name: auth
          secret: {secretName: {{ $root.Values.auth.opaque.tokenSecret | quote }}, items: [{key: {{ $root.Values.auth.opaque.tokenSecretKey | quote }}, path: tokens.json}]}
        {{- end }}
        {{- if and (eq $role "orchestrator") $root.Values.managedAgents.enabled }}
        - name: model-providers
          secret: {secretName: {{ $root.Values.managedAgents.providerSecret | quote }}, items: [{key: {{ $root.Values.managedAgents.providerFileKey | quote }}, path: providers.json}]}
        {{- if $root.Values.managedAgents.credentialSecret }}
        - name: model-credentials
          secret: {secretName: {{ $root.Values.managedAgents.credentialSecret | quote }}}
        {{- end }}
        {{- end }}
        {{- if and (eq $role "tool-broker") $root.Values.toolBroker.enabled $root.Values.toolBroker.credentialsSecret }}
        - name: tool-credentials
          secret: {secretName: {{ $root.Values.toolBroker.credentialsSecret | quote }}, items: [{key: {{ $root.Values.toolBroker.credentialsFileKey | quote }}, path: credentials.json}]}
        {{- end }}
        - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
---
{{- if $component.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: ngkg-{{ $role }}}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: ngkg-{{ $role }}}
  minReplicas: {{ $component.autoscaling.minReplicas }}
  maxReplicas: {{ $component.autoscaling.maxReplicas }}
  behavior:
    scaleUp: {selectPolicy: Max, stabilizationWindowSeconds: 0, policies: [{type: Percent, value: 100, periodSeconds: 60}, {type: Pods, value: 8, periodSeconds: 60}]}
    scaleDown: {stabilizationWindowSeconds: 600, policies: [{type: Percent, value: 25, periodSeconds: 120}]}
  metrics:
    - {type: Resource, resource: {name: cpu, target: {type: Utilization, averageUtilization: {{ $component.autoscaling.cpuTargetPercent }}}}}
    - {type: Resource, resource: {name: memory, target: {type: Utilization, averageUtilization: {{ $component.autoscaling.memoryTargetPercent }}}}}
---
{{- end }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: ngkg-{{ $role }}}
spec:
  maxUnavailable: 1
  selector: {matchLabels: {app.kubernetes.io/name: ngkg-agents, app.kubernetes.io/component: {{ $role }}}}
---
{{- end }}
{{- end }}
