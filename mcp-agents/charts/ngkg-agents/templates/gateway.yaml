apiVersion: v1
kind: ServiceAccount
metadata:
  name: ngkg-mcp-gateway
  labels: {{- include "ngkg-agents.labels" . | nindent 4 }}
  annotations: {{- toYaml .Values.inputStorage.serviceAccountAnnotations | nindent 4 }}
imagePullSecrets: {{ toJson .Values.imagePullSecrets }}
automountServiceAccountToken: true
---
apiVersion: v1
kind: Service
metadata:
  name: ngkg-mcp-gateway
  labels: {{- include "ngkg-agents.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: ngkg-agents
    app.kubernetes.io/component: mcp-gateway
  ports:
    - {name: http, port: {{ .Values.service.port }}, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ngkg-mcp-gateway
  labels: {{- include "ngkg-agents.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 1, maxSurge: 1}
  selector:
    matchLabels:
      app.kubernetes.io/name: ngkg-agents
      app.kubernetes.io/component: mcp-gateway
  template:
    metadata:
      labels: {{- include "ngkg-agents.labels" . | nindent 8 }}
      annotations:
        ngkg.io/auth-mode: {{ .Values.auth.mode | quote }}
        {{- if eq .Values.auth.mode "opaque" }}
        ngkg.io/query-token-file-sha256: {{ required "auth.opaque.tokenFileSha256 is required in opaque mode" .Values.auth.opaque.tokenFileSha256 | quote }}
        {{- end }}
    spec:
      serviceAccountName: ngkg-mcp-gateway
      imagePullSecrets: {{ toJson .Values.imagePullSecrets }}
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: {{ .Values.scheduling.topologyKey | quote }}
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: ngkg-agents
              app.kubernetes.io/component: mcp-gateway
      nodeSelector: {{- toYaml .Values.scheduling.nodeSelector | nindent 8 }}
      tolerations: {{- toYaml .Values.scheduling.tolerations | nindent 8 }}
      containers:
        - name: gateway
          image: '{{ required "image.repository is required" .Values.image.repository }}@{{ required "image.digest is required" .Values.image.digest }}'
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{name: http, containerPort: {{ .Values.service.port }} }]
          env:
            - {name: NGKG_COMPONENT_ROLE, value: {{ ternary "gateway" "all" .Values.gatewayApi.enabled | quote }}}
            - {name: NGKG_MCP_BIND, value: '0.0.0.0:{{ .Values.service.port }}'}
            - {name: NGKG_QUERY_BASE_URL, value: {{ .Values.query.baseUrl | quote }}}
            - {name: NGKG_MCP_QUERY_TOOLS_ENABLED, value: {{ .Values.query.toolsEnabled | quote }}}
            - {name: NGKG_ALLOW_HTTP_LOOPBACK, value: {{ .Values.query.allowHttpLoopback | quote }}}
            - {name: NGKG_AUTH_MODE, value: {{ .Values.auth.mode | quote }}}
            {{- if eq .Values.auth.mode "opaque" }}
            - {name: NGKG_AUTH_TOKEN_FILE, value: /var/run/ngkg/auth/tokens.json}
            - {name: NGKG_AUTH_TOKEN_FILE_SHA256, value: {{ required "auth.opaque.tokenFileSha256 is required" .Values.auth.opaque.tokenFileSha256 | quote }}}
            {{- else }}
            - {name: NGKG_AUTH_ISSUER, value: {{ required "auth.delegation.issuer is required" .Values.auth.delegation.issuer | quote }}}
            - {name: NGKG_AUTH_AUDIENCE, value: {{ required "auth.delegation.audience is required" .Values.auth.delegation.audience | quote }}}
            - {name: NGKG_AUTH_JWKS_URL, value: {{ required "auth.delegation.jwksUrl is required" .Values.auth.delegation.jwksUrl | quote }}}
            - {name: NGKG_AUTH_RESOURCE, value: {{ required "auth.delegation.resource is required" .Values.auth.delegation.resource | quote }}}
            - {name: NGKG_AUTH_AUTHORIZATION_SERVERS, value: {{ required "auth.delegation.authorizationServers is required" (join "," .Values.auth.delegation.authorizationServers) | quote }}}
            - {name: NGKG_AUTH_ALLOWED_ALGORITHMS, value: {{ join "," .Values.auth.delegation.allowedAlgorithms | quote }}}
            - {name: NGKG_AUTH_REQUIRED_TYP, value: {{ .Values.auth.delegation.requiredTyp | quote }}}
            - {name: NGKG_AUTH_MAX_TOKEN_LIFETIME_SECONDS, value: {{ .Values.auth.delegation.maximumTokenLifetimeSeconds | quote }}}
            - {name: NGKG_AUTH_CLOCK_SKEW_SECONDS, value: {{ .Values.auth.delegation.clockSkewSeconds | quote }}}
            - {name: NGKG_AUTH_JWKS_CACHE_TTL_SECONDS, value: {{ .Values.auth.delegation.jwksCacheTtlSeconds | quote }}}
            - {name: NGKG_AUTH_JWKS_LAST_KNOWN_GOOD_SECONDS, value: {{ .Values.auth.delegation.lastKnownGoodSeconds | quote }}}
            - {name: NGKG_AUTH_CONNECT_TIMEOUT_MS, value: {{ .Values.auth.delegation.connectTimeoutMilliseconds | quote }}}
            - {name: NGKG_AUTH_REQUEST_TIMEOUT_MS, value: {{ .Values.auth.delegation.requestTimeoutMilliseconds | quote }}}
            - {name: NGKG_AUTH_ALLOW_HTTPS_LOOPBACK, value: {{ .Values.auth.delegation.allowHttpsLoopback | quote }}}
            - {name: NGKG_AUTH_EXCHANGE_ENABLED, value: {{ .Values.auth.delegation.exchange.enabled | quote }}}
            - {name: NGKG_AUTH_EXCHANGE_SCOPES, value: {{ join "," .Values.auth.delegation.exchange.scopes | quote }}}
            {{- if .Values.auth.delegation.exchange.enabled }}
            - {name: NGKG_AUTH_EXCHANGE_ENDPOINT, value: {{ required "auth.delegation.exchange.endpoint is required" .Values.auth.delegation.exchange.endpoint | quote }}}
            - {name: NGKG_AUTH_EXCHANGE_CLIENT_AUTHENTICATION, value: {{ .Values.auth.delegation.exchange.clientAuthentication | quote }}}
            - {name: NGKG_AUTH_EXCHANGE_CONNECT_TIMEOUT_MS, value: {{ .Values.auth.delegation.connectTimeoutMilliseconds | quote }}}
            - {name: NGKG_AUTH_EXCHANGE_REQUEST_TIMEOUT_MS, value: {{ .Values.auth.delegation.requestTimeoutMilliseconds | quote }}}
            {{- if eq .Values.auth.delegation.exchange.clientAuthentication "client-secret-file" }}
            - {name: NGKG_AUTH_EXCHANGE_CLIENT_ID, value: {{ required "auth.delegation.exchange.clientId is required" .Values.auth.delegation.exchange.clientId | quote }}}
            - {name: NGKG_AUTH_EXCHANGE_CLIENT_SECRET_FILE, value: /var/run/ngkg/exchange/client-secret.json}
            - {name: NGKG_AUTH_EXCHANGE_CLIENT_SECRET_FILE_SHA256, value: {{ required "auth.delegation.exchange.clientSecretFileSha256 is required" .Values.auth.delegation.exchange.clientSecretFileSha256 | quote }}}
            {{- end }}
            {{- end }}
            {{- end }}
            - name: NGKG_AGENT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.runtimeSecret | quote }}
                  key: {{ .Values.database.runtimeSecretKey | quote }}
            - {name: NGKG_AGENT_DATABASE_MAX_CONNECTIONS, value: {{ .Values.database.maximumConnections | quote }}}
            - {name: NGKG_AGENT_DATABASE_ACQUIRE_TIMEOUT_MS, value: {{ .Values.database.acquireTimeoutMilliseconds | quote }}}
            - {name: NGKG_AGENT_DATABASE_ALLOW_INSECURE_LOOPBACK, value: {{ .Values.database.allowInsecureLoopback | quote }}}
            - {name: NGKG_AGENT_SERVICE_BUILD_SHA256, value: {{ required "audit.serviceBuildSha256 is required" .Values.audit.serviceBuildSha256 | quote }}}
            - {name: NGKG_MCP_ALLOWED_HOSTS, value: {{ required "mcp.allowedHosts is required" (join "," .Values.mcp.allowedHosts) | quote }}}
            - {name: NGKG_MCP_ALLOWED_ORIGINS, value: {{ required "mcp.allowedOrigins is required" (join "," .Values.mcp.allowedOrigins) | quote }}}
            - {name: NGKG_MCP_MAX_REQUEST_BYTES, value: {{ .Values.mcp.maximumRequestBytes | quote }}}
            - {name: NGKG_MCP_MAX_QUERY_BYTES, value: {{ .Values.mcp.maximumQueryBytes | quote }}}
            - {name: NGKG_MCP_MAX_UPSTREAM_RESPONSE_BYTES, value: {{ .Values.mcp.maximumUpstreamResponseBytes | quote }}}
            - {name: NGKG_MCP_MAX_IN_FLIGHT, value: {{ .Values.mcp.maximumInFlight | quote }}}
            - {name: NGKG_MCP_ADMISSION_TIMEOUT_MS, value: {{ .Values.mcp.admissionTimeoutMilliseconds | quote }}}
            - {name: NGKG_MCP_CONNECT_TIMEOUT_MS, value: {{ .Values.mcp.connectTimeoutMilliseconds | quote }}}
            - {name: NGKG_MCP_REQUEST_TIMEOUT_MS, value: {{ .Values.mcp.requestTimeoutMilliseconds | quote }}}
            - {name: NGKG_MCP_MAX_RESULT_ROWS, value: {{ .Values.mcp.maximumResultRows | quote }}}
            - {name: NGKG_MCP_MAX_CONTEXT_TRIPLES, value: {{ .Values.mcp.maximumContextTriples | quote }}}
            - {name: NGKG_MCP_MAX_CONTEXT_BYTES, value: {{ .Values.mcp.maximumContextBytes | quote }}}
            - {name: NGKG_INPUT_MAX_PART_BYTES, value: {{ .Values.inputApi.maximumPartBytes | quote }}}
            - {name: NGKG_INPUT_MAX_PARTS, value: {{ .Values.inputApi.maximumParts | quote }}}
            - {name: NGKG_INPUT_MAX_BYTES, value: {{ .Values.inputApi.maximumBytes | quote }}}
            - {name: NGKG_MANAGED_AGENTS_ENABLED, value: {{ .Values.managedAgents.enabled | quote }}}
            - {name: NGKG_AGENT_MAX_SOURCE_BYTES, value: {{ .Values.managedAgents.maximumSourceBytes | quote }}}
            - {name: NGKG_AGENT_MAX_REQUIREMENTS, value: {{ .Values.managedAgents.maximumRequirements | quote }}}
            - {name: NGKG_AGENT_MAX_MODEL_CONTEXT_BYTES, value: {{ .Values.managedAgents.maximumModelContextBytes | quote }}}
            - {name: NGKG_AGENT_MAX_CLAIMS, value: {{ .Values.managedAgents.maximumClaims | quote }}}
            - {name: NGKG_AGENT_MAX_OUTPUT_TOKENS, value: {{ .Values.managedAgents.maximumOutputTokens | quote }}}
            {{- if .Values.managedAgents.enabled }}
            - {name: NGKG_MODEL_PROVIDERS_FILE, value: /var/run/ngkg/model-providers/providers.json}
            - {name: NGKG_MODEL_PROVIDERS_FILE_SHA256, value: {{ required "managedAgents.providerFileSha256 is required" .Values.managedAgents.providerFileSha256 | quote }}}
            {{- end }}
            - {name: NGKG_TOOL_BROKER_ENABLED, value: {{ .Values.toolBroker.enabled | quote }}}
            - {name: NGKG_TOOL_PROTOCOL_VERSIONS, value: {{ join "," .Values.toolBroker.protocolVersions | quote }}}
            - {name: NGKG_TOOL_MAX_TOOLS, value: {{ .Values.toolBroker.maximumTools | quote }}}
            - {name: NGKG_TOOL_MAX_SCHEMA_DEPTH, value: {{ .Values.toolBroker.maximumSchemaDepth | quote }}}
            - {name: NGKG_TOOL_MAX_CATALOG_BYTES, value: {{ .Values.toolBroker.maximumCatalogBytes | quote }}}
            - {name: NGKG_TOOL_MAX_REQUEST_BYTES, value: {{ .Values.toolBroker.maximumRequestBytes | quote }}}
            - {name: NGKG_TOOL_MAX_RESPONSE_BYTES, value: {{ .Values.toolBroker.maximumResponseBytes | quote }}}
            - {name: NGKG_TOOL_MAX_CATALOG_PAGES, value: {{ .Values.toolBroker.maximumCatalogPages | quote }}}
            - {name: NGKG_TOOL_MAX_IN_FLIGHT, value: {{ .Values.toolBroker.maximumInFlight | quote }}}
            - {name: NGKG_TOOL_CONNECT_TIMEOUT_MS, value: {{ .Values.toolBroker.connectTimeoutMilliseconds | quote }}}
            - {name: NGKG_TOOL_REQUEST_TIMEOUT_MS, value: {{ .Values.toolBroker.requestTimeoutMilliseconds | quote }}}
            - {name: NGKG_TOOL_ALLOW_CLUSTER_PRIVATE_ENDPOINTS, value: {{ .Values.toolBroker.allowClusterPrivateEndpoints | quote }}}
            {{- if and .Values.toolBroker.enabled .Values.toolBroker.credentialsSecret }}
            - {name: NGKG_TOOL_CREDENTIALS_FILE, value: /var/run/ngkg/tool-credentials/credentials.json}
            - {name: NGKG_TOOL_CREDENTIALS_FILE_SHA256, value: {{ required "toolBroker.credentialsFileSha256 is required when credentialsSecret is set" .Values.toolBroker.credentialsFileSha256 | quote }}}
            {{- end }}
            - {name: NGKG_MEMORY_ENABLED, value: {{ .Values.memory.enabled | quote }}}
            - {name: NGKG_MEMORY_MAX_CONTENT_BYTES, value: {{ .Values.memory.maximumContentBytes | quote }}}
            - {name: NGKG_MEMORY_MAX_SEARCH_RESULTS, value: {{ .Values.memory.maximumSearchResults | quote }}}
            - {name: NGKG_MEMORY_MAX_STATEMENTS, value: {{ .Values.memory.maximumStatements | quote }}}
            - {name: NGKG_MEMORY_MAX_WORKING_TTL_SECONDS, value: {{ .Values.memory.maximumWorkingTtlSeconds | quote }}}
            - {name: NGKG_MEMORY_MAX_RETENTION_DAYS, value: {{ .Values.memory.maximumRetentionDays | quote }}}
            - {name: NGKG_INPUT_OBJECT_STORE, value: {{ .Values.inputStorage.provider | quote }}}
            {{- if eq .Values.inputStorage.provider "s3" }}
            - {name: NGKG_INPUT_S3_BUCKET, value: {{ required "inputStorage.s3.bucket is required" .Values.inputStorage.s3.bucket | quote }}}
            - {name: AWS_DEFAULT_REGION, value: {{ required "inputStorage.s3.region is required" .Values.inputStorage.s3.region | quote }}}
            {{- if .Values.inputStorage.s3.endpoint }}
            - {name: AWS_ENDPOINT, value: {{ .Values.inputStorage.s3.endpoint | quote }}}
            {{- end }}
            {{- else if eq .Values.inputStorage.provider "azure" }}
            - {name: NGKG_INPUT_AZURE_CONTAINER, value: {{ required "inputStorage.azure.container is required" .Values.inputStorage.azure.container | quote }}}
            - {name: AZURE_STORAGE_ACCOUNT_NAME, value: {{ required "inputStorage.azure.account is required" .Values.inputStorage.azure.account | quote }}}
            {{- if .Values.inputStorage.azure.endpoint }}
            - {name: AZURE_STORAGE_ENDPOINT, value: {{ .Values.inputStorage.azure.endpoint | quote }}}
            {{- end }}
            {{- else if eq .Values.inputStorage.provider "gcs" }}
            - {name: NGKG_INPUT_GCS_BUCKET, value: {{ required "inputStorage.gcs.bucket is required" .Values.inputStorage.gcs.bucket | quote }}}
            {{- if .Values.inputStorage.gcs.endpoint }}
            - {name: GOOGLE_SERVICE_ENDPOINT, value: {{ .Values.inputStorage.gcs.endpoint | quote }}}
            {{- end }}
            {{- else }}
            - {name: NGKG_INPUT_LOCAL_ROOT, value: {{ .Values.inputStorage.localTest.root | quote }}}
            {{- end }}
            - {name: OMP_NUM_THREADS, value: '1'}
            - {name: OPENBLAS_NUM_THREADS, value: '1'}
            - {name: MKL_NUM_THREADS, value: '1'}
            - {name: OMP_DYNAMIC, value: 'FALSE'}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          startupProbe: {httpGet: {path: /health/ready, port: http}, periodSeconds: 5, failureThreshold: 60}
          readinessProbe: {httpGet: {path: /health/ready, port: http}, periodSeconds: 5, timeoutSeconds: 2, failureThreshold: 3}
          livenessProbe: {httpGet: {path: /health/live, port: http}, periodSeconds: 15, timeoutSeconds: 2, failureThreshold: 3}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            {{- if eq .Values.auth.mode "opaque" }}
            - {name: auth, mountPath: /var/run/ngkg/auth, readOnly: true}
            {{- end }}
            {{- if and (eq .Values.auth.mode "delegation") .Values.auth.delegation.exchange.enabled (eq .Values.auth.delegation.exchange.clientAuthentication "client-secret-file") }}
            - {name: exchange-auth, mountPath: /var/run/ngkg/exchange, readOnly: true}
            {{- end }}
            {{- if .Values.managedAgents.enabled }}
            - {name: model-providers, mountPath: /var/run/ngkg/model-providers, readOnly: true}
            {{- if .Values.managedAgents.credentialSecret }}
            - {name: model-credentials, mountPath: /var/run/ngkg/model-credentials, readOnly: true}
            {{- end }}
            {{- end }}
            {{- if and .Values.toolBroker.enabled .Values.toolBroker.credentialsSecret }}
            - {name: tool-credentials, mountPath: /var/run/ngkg/tool-credentials, readOnly: true}
            {{- end }}
            - {name: tmp, mountPath: /tmp}
      volumes:
        {{- if eq .Values.auth.mode "opaque" }}
        - name: auth
          secret:
            secretName: {{ .Values.auth.opaque.tokenSecret | quote }}
            items:
              - key: {{ .Values.auth.opaque.tokenSecretKey | quote }}
                path: tokens.json
        {{- end }}
        {{- if and (eq .Values.auth.mode "delegation") .Values.auth.delegation.exchange.enabled (eq .Values.auth.delegation.exchange.clientAuthentication "client-secret-file") }}
        - name: exchange-auth
          secret:
            secretName: {{ required "auth.delegation.exchange.clientSecret is required" .Values.auth.delegation.exchange.clientSecret | quote }}
            items:
              - key: {{ .Values.auth.delegation.exchange.clientSecretKey | quote }}
                path: client-secret.json
        {{- end }}
        {{- if .Values.managedAgents.enabled }}
        - name: model-providers
          secret:
            secretName: {{ .Values.managedAgents.providerSecret | quote }}
            items:
              - key: {{ .Values.managedAgents.providerFileKey | quote }}
                path: providers.json
        {{- if .Values.managedAgents.credentialSecret }}
        - name: model-credentials
          secret:
            secretName: {{ .Values.managedAgents.credentialSecret | quote }}
        {{- end }}
        {{- end }}
        {{- if and .Values.toolBroker.enabled .Values.toolBroker.credentialsSecret }}
        - name: tool-credentials
          secret:
            secretName: {{ .Values.toolBroker.credentialsSecret | quote }}
            items:
              - key: {{ .Values.toolBroker.credentialsFileKey | quote }}
                path: credentials.json
        {{- end }}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
