[workspace]
resolver = "3"
members = [
  "crates/ngkg-artifact-store",
  "crates/ngkg-catalog",
  "crates/ngkg-distributed-build",
  "crates/ngkg-distributed-artifacts",
  "crates/ngkg-semantic-compiler",
  "crates/ngkg-ontology-qualifier",
  "crates/ngkg-offline-reasoner",
  "crates/ngkg-snapshot-activation",
  "crates/ngkg-dataset",
  "crates/ngkg-direct-reasoner",
  "crates/ngkg-sparql-compiler",
  "crates/ngkg-grace-join",
  "crates/ngkg-federation",
  "crates/ngkg-autoscaling",
  "crates/ngkg-storage-recovery",
  "crates/ngkg-standards-qualification",
  "crates/ngkg-performance-qualification",
  "crates/ngkg-release-qualification",
  "crates/ngkg-identity",
  "crates/ngkg-hydration",
  "crates/ngkg-hpc-runtime",
  "crates/ngkg-index",
  "crates/ngkg-locator",
  "crates/ngkg-kube",
  "crates/ngkg-operator-core",
  "crates/ngkg-owl-direct",
  "crates/ngkg-online-reasoning",
  "crates/ngkg-mapping",
  "crates/ngkg-projection",
  "crates/ngkg-query-executor",
  "crates/ngkg-query-cache",
  "crates/ngkg-query-planner",
  "crates/ngkg-reference",
  "crates/ngkg-reasoner-client",
  "crates/ngkg-source-planner",
  "crates/ngkg-snapshot",
  "crates/ngkg-shuffle-cache",
  "crates/ngkg-types",
  "services/api",
  "services/catalog-migrator",
  "services/distributed-worker",
  "services/distributed-operator",
  "services/direct-reasoner-worker",
  "services/operator",
  "services/online-serving",
  "services/reference-worker",
  "services/storage-recovery-worker",
  "services/storage-recovery-operator",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.97.1"
version = "1.0.0"

[workspace.dependencies]
anyhow = "=1.0.100"
async-trait = "=0.1.89"
arrow-array = "=58.0.0"
arrow-ipc = "=58.0.0"
arrow-schema = "=58.0.0"
axum = "=0.8.9"
blake3 = "=1.8.2"
bytes = "=1.11.0"
chrono = { version = "=0.4.44", default-features = false, features = ["clock", "serde"] }
datafusion = "=54.1.0"
futures = "=0.3.31"
hex = "=0.4.3"
http = "=1.4.0"
k8s-openapi = { version = "=0.28.0", features = ["v1_36"] }
kube = { version = "=4.2.0", features = ["client", "derive", "runtime", "rustls-tls"] }
memmap2 = "=0.9.8"
object_store = { version = "=0.13.2", default-features = false, features = ["aws", "fs", "tokio", "tls-webpki-roots"] }
oxigraph = { version = "=0.5.9", default-features = false }
oxiri = "=0.2.11"
parquet = { version = "=58.0.0", features = ["async"] }
reqwest = { version = "=0.12.24", default-features = false, features = ["blocking", "json", "rustls-tls", "stream"] }
roaring = "=0.11.2"
schemars = { version = "=1.0.0", features = ["uuid1"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
serde_yaml = "=0.9.34"
sha2 = "=0.10.9"
spargebra = { version = "=0.4.6", features = ["standard-unicode-escaping"] }
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "migrate"] }
thiserror = "=2.0.17"
tokio = { version = "=1.48.0", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = "=0.5.2"
tower-http = { version = "=0.6.6", features = ["request-id", "trace"] }
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.20", features = ["env-filter", "json"] }
uuid = { version = "=1.19.0", features = ["serde", "v4", "v5"] }
url = "=2.5.7"
utoipa-swagger-ui = { version = "=9.0.2", default-features = false, features = ["vendored", "debug-embed"] }

[patch.crates-io]
# Phase 40.13.5 carries narrowly scoped, regression-tested SPARQL 1.1 and RDF
# term-identity fixes against the exact dependency versions pinned above. Keeping
# the patches in-tree makes native, container, and air-gapped Kubernetes builds
# consume the same scalar correctness oracle.
oxigraph = { path = "vendor/oxigraph" }
spareval = { path = "vendor/spareval" }
sparopt = { path = "vendor/sparopt" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
